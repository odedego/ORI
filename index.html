<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HARD WORK">
<title>HARD WORK</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#E10600;--bg:#08080A;--c1:#151517;--c2:#1E1E21;--c3:#2A2A2E;
--tx:#FFFFFF;--t2:#A1A1A6;--t3:#8A8A92;--miss:#7A1E1B;--red2:#FF4B45;
--ok:#E8C24A;--gd:#C9A227;--gl:#F7DC8A;--on:#0A0A0A;
--gsolid:linear-gradient(135deg,var(--gl) 0%,var(--ok) 45%,var(--gd) 100%);
--nav:calc(58px + env(safe-area-inset-bottom));}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);
font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
font-size:16px;line-height:1.5;overscroll-behavior-y:none}
body{padding-bottom:var(--nav)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
.ltr{direction:ltr;unicode-bidi:bidi-override;display:inline-block}
@keyframes sweep{0%{transform:translateX(-150%)}100%{transform:translateX(150%)}}
.spark{position:relative;overflow:hidden;isolation:isolate}
.spark::after{content:'';position:absolute;top:-40%;bottom:-40%;width:60%;pointer-events:none;
background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);
animation:sweep .95s cubic-bezier(.3,0,.2,1) 1 both}
@media (prefers-reduced-motion:reduce){.spark::after{animation:none;display:none}}

.wrap{padding:max(calc(env(safe-area-inset-top) + 18px),56px) 16px 24px;max-width:560px;margin:0 auto}
.h1{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.h2{font-size:20px;font-weight:800;margin-bottom:2px}
.sub{font-size:13px;color:var(--t2)}
.tiny{font-size:11px;color:var(--t3)}
.bar{height:3px;width:44px;background:var(--red);margin:9px 0 18px;border-radius:2px}
.zone{font-family:inherit;font-size:19px;font-weight:900;margin:26px 0 11px;letter-spacing:-.3px}
.zone:first-of-type{margin-top:20px}
.gear{flex:0 0 44px;width:44px;height:44px;padding:9px;color:var(--t2)}
.gear svg{width:100%;height:100%}
.sec{font-size:12px;font-weight:800;color:var(--red2);letter-spacing:2px;margin:26px 0 10px}

.card{background:var(--c1);border-radius:14px;padding:14px;margin-bottom:10px}
.card.flat{background:none;border:1px solid var(--c3)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row[onclick]{min-height:44px;align-items:center}
.nm{font-size:16px;font-weight:700;line-height:1.25}
.sr{font-size:15px;font-weight:800;color:var(--red2);direction:ltr;unicode-bidi:bidi-override;white-space:nowrap}
.cue{font-size:12px;color:var(--t3);margin-top:3px;line-height:1.45}
.last{font-size:12px;color:var(--t2);margin-top:6px}

.sets{display:flex;gap:6px;margin-top:11px}
.set{flex:1;background:var(--c2);border-radius:9px;padding:13px 2px;text-align:center;min-height:44px;
font-size:12px;font-weight:700;color:var(--t3);transition:transform .08s}
.set:active{transform:scale(.94)}
.set.on{background:var(--red);color:#fff}
.acts{display:flex;gap:6px;margin-top:8px}
.act{flex:1;border:1px solid var(--c3);border-radius:9px;padding:13px 2px;text-align:center;min-height:44px;
font-size:12px;font-weight:500;color:var(--t2)}
.act:active{background:var(--c2)}
.act.solid{background:var(--red);color:#fff;border-color:var(--red2);font-weight:700}

.chk{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--c2);font-size:15px;min-height:48px}
.chk:last-child{border-bottom:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--c3);flex:0 0 24px;
display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.chk.on .box{background:var(--gsolid);border-color:var(--gd);color:var(--on)}
.chk.on .ct{color:var(--t3);text-decoration:line-through}
.chk.on .ct .cue{text-decoration:none}
.ct{flex:1;line-height:1.3}
.qw{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:7px}
.cq{font-size:12px;color:var(--red2);font-weight:700;text-align:center;line-height:1.35}
.vi{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;flex:0 0 36px;
display:flex;align-items:center;justify-content:center;position:relative}
.vi::after{content:'';position:absolute;inset:-4px;border-radius:50%}
.chk{align-items:flex-start}
.chk.on .vi{background:var(--c3)}

.nav{position:fixed;bottom:0;right:0;left:0;background:rgba(10,10,12,.94);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--c2);
display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
.nb{flex:1;padding:9px 0 7px;text-align:center;font-size:10px;color:var(--t3);font-weight:500}
.nb.on{color:var(--red2)}
.ni{display:block;width:23px;height:23px;margin:0 auto 4px}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:none;
align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sc{background:#141416;width:100%;max-width:560px;border-radius:20px 20px 0 0;
padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.grab{width:38px;height:4px;background:var(--c3);border-radius:2px;margin:0 auto 16px}
.blk{margin-bottom:18px}
.blk h4{font-size:13px;font-weight:800;color:var(--red2);letter-spacing:1px;margin-bottom:7px}
.blk p,.blk li{font-size:14.5px;color:#D8D8DC;line-height:1.6}
.blk ol{padding-right:18px}
.blk li{margin-bottom:6px}
.feel{background:#241012;border-radius:11px;padding:13px;white-space:pre-line}

.num{display:flex;gap:10px;margin:16px 0}
.num>div{flex:1}
.num label{display:block;font-size:12px;color:var(--t2);margin-bottom:5px}
.num input{width:100%;background:var(--c2);border:1px solid var(--c3);border-radius:11px;
padding:14px;color:#fff;font-size:22px;font-weight:800;text-align:center;direction:ltr}
.big{width:100%;background:var(--red);color:#fff;border-radius:12px;padding:15px;
font-size:16px;font-weight:800;text-align:center}
.ghost{width:100%;border:1px solid var(--c3);border-radius:12px;padding:13px;
font-size:14px;font-weight:500;color:var(--t2);text-align:center;margin-top:9px}

.timer{position:fixed;top:0;right:0;left:0;background:var(--red);color:#fff;
padding:max(calc(env(safe-area-inset-top) + 9px),48px) 16px 9px;text-align:center;
font-size:15px;font-weight:800;z-index:70;display:none}
.timer.on{display:block}
.timer.prep{background:var(--c3);font-size:20px;letter-spacing:1px}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--c2);vertical-align:top}
.tbl td:first-child{color:var(--red2);font-weight:700;white-space:nowrap;width:64px}
.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-block;background:var(--c2);border-radius:7px;padding:3px 9px;
font-size:11px;color:var(--t2);margin:0 0 0 5px}
.hero{background:linear-gradient(0deg,#0E0E10,#18181B);border-radius:18px;padding:20px;margin-bottom:14px}
.stat{display:flex;gap:9px;margin-top:14px}
.stat>div{flex:1;background:var(--c1);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-size:24px;font-weight:900;color:var(--red);line-height:1.1}
.stat .k{font-size:10.5px;color:var(--t3);margin-top:3px}
.gap{height:8px}
.list{background:var(--c1);border-radius:14px;padding:4px 14px}
.bwrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--c2);font-size:14px}
.bwrow:last-child{border-bottom:none}
.q{font-size:14px;color:#D8D8DC;line-height:1.6;padding:11px 0;border-bottom:1px solid var(--c2)}
.q:last-child{border-bottom:none}
.warnbox{border:1px solid var(--red);border-radius:12px;padding:13px;margin-top:12px}
.warnbox b{color:var(--red2)}
.warnbox p{font-size:13.5px;color:#D8D8DC;line-height:1.55}
.two2{display:flex;gap:9px;margin-top:18px}
.mini{flex:1;border:1px solid var(--c3);border-radius:12px;padding:14px 8px;font-size:13px;font-weight:500;color:var(--t2)}
.mini:active{background:var(--c1)}
.wk{display:grid;grid-template-columns:24px repeat(7,1fr);gap:4px;direction:rtl;align-items:center}
.wk .hd{font-size:11px;color:var(--t3);text-align:center;font-weight:500;padding-bottom:2px}
.wk .hd.now{color:var(--red2);font-weight:800}
.wk .rl{display:flex;align-items:center;justify-content:center;color:var(--t2)}
.wk .rl svg{width:16px;height:16px}
.wk .c{height:19px;border-radius:5px;background:var(--miss)}
.wk .c.wait{background:#35353B}
.wk .c.on{background:var(--gsolid)}
.wk .c.off{background:none;border:1px solid #232326}
.wk .c.now{outline:1.5px solid var(--red);outline-offset:1.5px}
.fnum{font-family:inherit;font-size:34px;font-weight:900;color:var(--ok);line-height:1}
.fnum .fof{font-size:14px;font-weight:700;color:var(--t3)}
.fbar{display:flex;gap:5px;margin-top:14px}
.fbar span{flex:1;height:10px;border-radius:4px;background:var(--c3);transition:background .2s}
.fbar span.on{background:var(--gsolid)}
.badge{background:var(--gsolid);color:var(--on);font-size:10.5px;font-weight:800;
padding:4px 9px;border-radius:7px;letter-spacing:0;white-space:nowrap}
.ringwrap{position:relative;flex:0 0 104px;width:104px;height:104px}
.ringsvg{width:104px;height:104px;display:block}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:1px}
.rnum{font-size:27px;font-weight:900;line-height:1;color:var(--ok);direction:ltr}
.rnum.zero{color:var(--t3)}
.rnum .rp{font-size:14px;font-weight:700}
.rdone{font-size:30px;color:var(--ok);line-height:1}
.rlbl{font-size:10.5px;color:var(--t3);font-weight:500}
.today{display:flex;gap:14px;align-items:center;margin-top:14px}
.today .tx{flex:1;min-width:0}
.mot{border-right:2px solid var(--red);padding:1px 12px 1px 0;margin:18px 0 2px;
font-size:14.5px;line-height:1.55;color:#DCDCE0}
.tdl{margin-top:12px}
.tdh{font-size:12px;font-weight:800;color:var(--red2);letter-spacing:2px;margin:20px 0 9px}
.tdi{display:flex;width:100%;align-items:center;gap:11px;background:var(--c1);
border:1px solid var(--c2);border-radius:12px;padding:11px 13px;margin-bottom:7px;
text-align:right;min-height:58px}
.tdi:active{background:var(--c2)}
.tdi .tdc{flex:0 0 21px;height:21px;color:var(--red2);display:flex}
.tdi .tdt{flex:1;min-width:0}
.tdi .tdt b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.tdi .tdt i{display:block;font-style:normal;font-size:11.5px;color:var(--t2);margin-top:3px}
.tdi .tdm{flex:0 0 auto;font-size:12.5px;font-weight:800;color:#C8C8CE;background:var(--c2);
border-radius:8px;padding:6px 10px;white-space:nowrap}
.tdd{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tdd span{font-size:12.5px;font-weight:800;color:var(--ok);background:rgba(232,194,74,.12);
border:1px solid rgba(232,194,74,.38);border-radius:9px;padding:7px 11px}
.allin{background:rgba(232,194,74,.10);border:1px solid rgba(232,194,74,.36);border-radius:12px;
padding:13px;text-align:center;font-size:14px;font-weight:800;color:var(--ok)}
.fxhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;
color:var(--t2);margin:16px 0 8px}
.fxbar{height:5px;background:var(--c2);border-radius:3px;overflow:hidden;margin-bottom:13px}
.fxbar i{display:block;height:100%;background:var(--gsolid);border-radius:3px}
.fxcard{background:var(--c1);border:1px solid var(--c2);border-radius:16px;padding:17px 15px}
.fxname{font-size:23px;font-weight:900;line-height:1.15}
.fxcue{font-size:13px;color:var(--t2);margin-top:6px;line-height:1.45}
.fxtar{font-size:27px;font-weight:900;color:var(--red2);margin-top:11px;
direction:ltr;text-align:right;letter-spacing:-.5px}
.stall{margin-top:9px;border-right:2px solid var(--gd);padding:7px 10px 7px 0;
font-size:12.5px;line-height:1.45;color:var(--t2)}
.fxnav{display:flex;gap:7px;margin-top:11px}
.fxnav button{flex:1;border:1px solid var(--c3);border-radius:11px;padding:13px 6px;
font-size:14px;font-weight:700;color:var(--t2);min-height:48px}
.fxnav button.go{background:var(--red);color:#fff;border-color:var(--red)}
.fxnav button.fin{background:var(--gsolid);color:var(--on);border-color:var(--gd)}
.fxnav button.off{opacity:.35}
.seg{display:flex;gap:7px;margin:14px 0 4px}
.sg{flex:1;border:1px solid var(--c2);background:var(--c1);border-radius:12px;
padding:11px 6px;text-align:center;min-height:58px}
.sg b{display:block;font-size:14px;font-weight:700;color:var(--t2);line-height:1.2}
.sg i{display:block;font-style:normal;font-size:11.5px;color:var(--t3);margin-top:3px;font-weight:700}
.sg.on{border-color:var(--red2);background:#1C1416}
.sg.on b{color:#fff}
.sg.on i{color:var(--red2)}
.sg.fin{border-color:var(--gd)}
.sg.fin b,.sg.fin i{color:var(--ok)}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.intent{border:1px solid var(--c3);border-radius:12px;padding:13px;margin-top:12px}
.intent .ih{font-size:11px;font-weight:800;color:var(--red2);letter-spacing:2px;margin-bottom:8px}
.intent .it{font-size:14.5px;line-height:1.55;color:#DCDCE0}
.intent.on{border-color:var(--gd);background:rgba(232,194,74,.07)}
.intent.on .ih{color:var(--ok)}
.iact{display:flex;gap:7px;margin-top:12px}
.iact button{flex:1;border:1px solid var(--c3);border-radius:10px;padding:12px 6px;
font-size:13px;font-weight:700;color:var(--t2);min-height:44px}
.iact button.go{background:var(--red);color:#fff;border-color:var(--red)}
.dsel{display:flex;gap:5px;margin:14px 0 12px}
.dbt{flex:1;border:1px solid var(--c2);background:var(--c1);border-radius:10px;padding:12px 0;
font-size:14px;font-weight:700;color:var(--t2);min-height:44px}
.dbt.on{background:var(--red);color:#fff;border-color:var(--red)}
.srow{display:flex;width:100%;align-items:center;gap:11px;border:1px solid var(--c2);
background:var(--c1);border-radius:11px;padding:12px 13px;margin-bottom:7px;min-height:48px;text-align:right}
.srow .sbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--c3);flex:0 0 24px;
display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.srow.on .sbox{background:var(--gsolid);border-color:var(--gd);color:var(--on)}
.srow .snm{flex:1;font-size:15px;font-weight:700}
.srow.on .snm{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chp{border:1px solid var(--c3);background:var(--c1);border-radius:10px;padding:11px 13px;
font-size:13px;font-weight:600;color:var(--t2);min-height:44px}
.chp.on{background:var(--gsolid);border-color:var(--gd);color:var(--on);font-weight:800}
.chp.fx.on{background:var(--red);border-color:var(--red);color:#fff}
.mb{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mbb{flex:1 1 30%;border:1px solid var(--c3);background:var(--c1);border-radius:10px;padding:12px 4px;
font-size:13px;font-weight:700;color:var(--t2);min-height:46px}
.mbb.on{background:var(--red);border-color:var(--red);color:#fff}
.foc{border:1px solid var(--gd);background:rgba(232,194,74,.07);border-radius:12px;padding:13px;margin-top:12px}
.foc .fh{font-size:11px;font-weight:800;color:var(--ok);letter-spacing:2px}
.foc .ft{font-size:17px;font-weight:900;margin-top:5px}
.foc .fs{font-size:12px;color:var(--t2);margin-top:4px}
/* ---------- שינה ---------- */
.slp{border:1px solid var(--c3);border-radius:12px;padding:13px;margin-top:12px}
.slp.on{border-color:var(--gd);background:rgba(232,194,74,.07)}
.slp .slh{font-size:11px;font-weight:800;color:var(--red2);letter-spacing:2px}
.slp.on .slh{color:var(--ok)}
.slb{display:flex;gap:6px;margin-top:11px}
.slb button{flex:1 1 0;min-width:0;border:1px solid var(--c3);background:var(--c1);
border-radius:11px;min-height:52px;font-size:20px;font-weight:900;color:#fff}
.slb button:active{background:var(--red);border-color:var(--red)}
.slb button.on{background:var(--gsolid);border-color:var(--gd);color:var(--on)}
.slr{display:flex;align-items:center;gap:11px;margin-top:9px}
.slv{flex:0 0 auto;font-size:38px;font-weight:900;line-height:1;color:var(--ok)}
.slm{flex:1 1 auto;min-width:0;font-size:13px;font-weight:700;color:var(--t2)}
.sle{flex:0 0 auto;border:1px solid var(--c3);border-radius:9px;padding:0 13px;
min-height:44px;font-size:12px;font-weight:700;color:var(--t2)}
.slc{margin-top:16px}
/* שורת העמודות היא מיכל בגובה קבוע ומדויק, כדי שקו היעד יישען על מספר
   ידוע ולא על ניחוש של גובה התווית שמתחתיו. */
.slbars{position:relative;display:flex;gap:6px;align-items:flex-end;height:84px}
.slbar{flex:1 1 0;min-width:0;height:100%;border-radius:7px;background:var(--c2);
display:flex;align-items:flex-end;overflow:hidden}
.slbar i{display:block;width:100%;border-radius:7px}
.slbar i.ok{background:var(--gsolid)}
/* לילה קצר נראה — הוא פשוט לא זוהר. אפור ולא אדום: אין כאן כישלון לסמן. */
.slbar i.low{background:#6E6E73}
.slbar i.none,.slbar i.fut{background:transparent}
.sldls{display:flex;gap:6px;margin-top:6px}
.sldl{flex:1 1 0;min-width:0;text-align:center;font-size:11px;font-weight:700;color:var(--t3)}
.sldl.t{color:#fff}
.sltg{position:absolute;right:0;left:0;bottom:calc(84px*.8);height:1px;
background:var(--red);opacity:.6;pointer-events:none}
/* התווית יושבת מתחת לגרף ולא עליו: תג שצף בפינה נדרס על ידי עמודה גבוהה
   ונצמד לשפת הכרטיס. מקרא לא מתנגש עם שום נתון. */
.sltgl{display:flex;align-items:center;gap:6px;margin-top:9px;
font-size:11px;font-weight:700;color:var(--t3)}
.sltgl i{flex:0 0 16px;height:1px;background:var(--red);opacity:.6}
.ngame{border:1px solid var(--c3);border-radius:12px;padding:13px;margin-top:12px}
.ngame .ngh{font-size:11px;font-weight:800;color:var(--red2);letter-spacing:2px}
.ngame .ngt{font-size:19px;font-weight:900;margin-top:5px}
.ngame .ngd{font-size:12px;color:var(--t2);margin-top:3px}

function missingNights(){const out=[];
for(let i=7;i>=1;i--){const k=shiftKey(-i);
 if(S.start&&dnum(k)<dnum(S.start))continue;
 if(pausedOn(k))continue;

function wakeMin(){const w=WAKES.includes(S.wake)?S.wake:WAKE_DEF,p=w.split(':');return(+p[0])*60+(+p[1])}
function hhmm(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60);
return (h?String(h):'00')+':'+String(m%60).padStart(2,'0')}
function bedMin(){return wakeMin()+1440-SLEEP_OK*60}
function eveningNow(){const d=nowD(),m=d.getHours()*60+d.getMinutes();return m>=19*60&&m<=bedMin()}
function sleepWeek(back){const ds=weekDays(back||0);
const rows=ds.map(x=>({k:x.k,w:x.w,fut:x.fut,b:sleepOf(x.k)}));
const got=rows.filter(x=>x.b);
return{rows,n:got.length,
 ok:got.filter(x=>sleepHrs(x.b)>=SLEEP_OK).length,
 avg:got.length?Math.round(got.reduce((a,x)=>a+sleepHrs(x.b),0)/got.length*10)/10:0}}
/* הרצף הארוך ביותר של לילות בטווח. ימים חסרים שוברים את הרצף —
   לילה שלא נרשם הוא לא לילה שנספר. */
function sleepRun(){const m={};(S.sleep||[]).forEach(x=>m[x.d]=x.b);
const ks=Object.keys(m).sort((a,b)=>dnum(a)-dnum(b));
let n=0,best=0,prev=null;
for(const k of ks){
 if(prev!==null&&Math.round((dnum(k)-dnum(prev))/864e5)!==1)n=0;
 n=sleepHrs(m[k])>=SLEEP_OK?n+1:0;
 if(n>best)best=n;prev=k}
return best}
function lastSets(id){for(let i=S.sessions.length-1;i>=0;i--){const l=S.sessions[i].log[id];
if(l&&l.length)return l}return null}
function suggestKg(id){const e=EX[id],l=lastSets(id);
if(!l||l.length<e.s)return null;
if(!l.every(x=>x&&x[1]>=e.r))return null;
const inc=['רגליים','שוקיים'].includes(e.g)?2.5:2;
const base=med(l.map(x=>x[0]));
return base>0&&base<=300?Math.round((base+inc)*2)/2:null}
function nextW(){for(let i=S.sessions.length-1;i>=0;i--){return S.sessions[i].w==='A'?'B':'A'}return'A'}
function bestFor(id){let b=null;
for(const s of S.sessions){const l=s.log[id];if(!l)continue;
 for(const x of l){if(!x)continue;
  if(!b||x[0]>b.kg||(x[0]===b.kg&&x[1]>b.rp))b={kg:x[0],rp:x[1],d:s.date}}}
return b}
function lastFor(id){for(let i=S.sessions.length-1;i>=0;i--){const l=S.sessions[i].log[id];
if(l&&l.length)return l.reduce((a,b)=>b[0]>a[0]?b:a)}return null}

if(diff>=0&&diff<=4){n++;cur=t}else break}return n}

   יום שרוקן ידנית כן נחשב יום שלא נעשה בו כלום. */
/* יום הפסקה מחזיר null: הוא לא מלא ולא שבור — הרצף פשוט מדלג עליו. */
function dayDoneAll(back){const d=nowD();d.setDate(d.getDate()-back);
const w=d.getDay(),k=dkey(d),S3=sets();
if(pausedOn(k))return null;
const pl=ROWS.filter(([,key])=>isPl(key,k,w));
if(!pl.length)return !SKEYS.filter(x=>x!=='team').some(x=>SCHED[x].includes(w));
return pl.every(([,key])=>S3[key].has(k))}
function fullStreak(){let n=0;for(let i=1;i<=90;i++){const r=dayDoneAll(i);
if(r===null)continue;if(r)n++;else break}return n}
/* רצף ימים מלאים, עם הקפאה אחת לכל שבעה ימים רצופים.
   היום הראשון שנשבר הוא בדרך כלל גם האחרון — ההקפאה קונה לו יום. */
function dayStreak(){let n=0,fr=0,sinceFr=99;
for(let i=(dayDoneAll(0)===true?0:1);i<=120;i++){const r=dayDoneAll(i);
 if(r===null)continue;
 if(r){n++;sinceFr++;continue}
 if(sinceFr>=7){fr++;sinceFr=0;n++;continue}
 break}
return{n,fr}}
function missedYesterday(){if(!workDays())return false;
const d=nowD();d.setDate(d.getDate()-1);
const w=d.getDay(),k=dkey(d),S3=sets();
const pl=ROWS.filter(([,key])=>isPl(key,k,w));
return pl.length>0&&!pl.some(([,key])=>S3[key].has(k))}

function workDays(){const S3=sets(),u=new Set();
ROWS.forEach(([,k])=>S3[k].forEach(x=>u.add(x)));S3.team.forEach(x=>u.add(x));return u.size}
function bestGain(){let best=null;
Object.keys(EX).forEach(id=>{const all=S.sessions.map(x=>x.log[id]).filter(l=>l&&l.length);
if(all.length<2)return;
const a=Math.max(...all[0].map(x=>x[0])),b=Math.max(...all[all.length-1].map(x=>x[0]));
const g=Math.round((b-a)*2)/2;
if(g>0&&(!best||g>best.g))best={n:EX[id].n,g}});return best}
function bwGain(){if(S.bw.length<2)return null;

`${f?`<div class="sec">הדגש מהמשחק הקודם</div>

let gameCtx=null;
function saveGame(){const k=gameCtx,d=gDraft;
if(d.mb<0){toast('כמה שיחקת?');return}
if(!S.games)S.games=[];
const i=S.games.findIndex(x=>x.d===k);
const b=i>-1?S.games[i]:{opp:'',home:1};
const rec={d:k,opp:b.opp||'',home:b.home?1:0,mb:d.mb,
 good:d.mb===0?'':d.good,fix:d.mb===0?'':d.fix,saw:d.mb===0?d.saw:'',
 note:'',prev:d.prev||'',lg:1};
if(i>-1)S.games[i]=rec;else S.games.push(rec);
S.games.sort((a,b)=>dnum(a.d)-dnum(b.d));
if(rec.prev)bumpFocus(rec.prev);
const nf=rec.fix||rec.saw;
if(nf&&(!S.focus||!S.focus.c))setFocus(nf);
save();closeSheet();draw();
toast(focusOn()?'נרשם · הדגש: '+chipName(S.focus.c):'נרשם');
try{unlockAudio();winTone()}catch(e){}
popMile()}

function snapWeek(days){const S3=sets(),ks=days.map(x=>x.k);
const c=k=>[days.filter(x=>S3[k].has(x.k)).length,days.filter(x=>isPl(k,x.k,x.w)).length];
const bw=(S.bw||[]).filter(x=>ks.includes(x.d)).pop();
return{w:days[0].k,gym:c('gym'),foot:c('foot'),shot:c('shot'),fuel:c('fuel'),team:c('team'),
 bw:bw?bw.kg:null,
 g:(S.games||[]).filter(x=>ks.includes(x.d)&&x.lg).map(x=>({d:x.d,mb:x.mb})),
 est:days.some(x=>!(S.dayplan||{})[x.k])?1:0}}
function rollWeeks(){if(!Array.isArray(S.weeks))S.weeks=[];
const cur=weekDays(0)[0].k;let added=0;
for(let b=1;b<=8;b++){const days=weekDays(b),wk=days[0].k;
 if(wk===cur)continue;
 if(S.weeks.some(x=>x.w===wk))continue;
 if(S.start&&dnum(wk)<dnum(weekDays(0)[0].k)-8*6048e5)continue;
 if(S.start&&dnum(days[6].k)<dnum(S.start))continue;
 S.weeks.push(snapWeek(days));added++}
if(added){S.weeks.sort((a,b)=>dnum(a.w)-dnum(b.w));
 if(S.weeks.length>60)S.weeks=S.weeks.slice(-60);save()}
return added}

/* חציון המשקל באימון, לא המקסימום — סט כבד בודד לא מצייר מגמה. */
function exSeries(id){const out=[];
S.sessions.forEach(x=>{const l=(x.log||{})[id];if(!l||!l.length)return;
 const v=l.filter(Boolean).map(y=>y[0]).filter(y=>y>0);
 if(v.length)out.push({d:x.date,kg:med(v)})});
return out}
/* תקיעה = מספר האימונים האחרונים שבהם החציון לא עלה מעל השיא שלפניהם. */
function exStall(id){const s=exSeries(id);
if(s.length<3)return 0;
let top=s[0].kg,n=0;
for(let i=1;i<s.length;i++){if(s[i].kg>top){top=s[i].kg;n=0}else n++}
return n>=3?n:0}
function exTrend(){return Object.keys(EX).map(id=>{const s=exSeries(id);
 if(s.length<2)return null;
 return{n:EX[id].n,a:s[0].kg,b:s[s.length-1].kg,c:s.length,stall:exStall(id)}})
 .filter(Boolean).sort((a,b)=>b.c-a.c).slice(0,6)}

function weekPR(keys){let best=null;
Object.keys(EX).forEach(id=>{let pre=0,top=null,cnt=0;
 S.sessions.forEach(x=>{const l=x.log[id];if(!l||!l.length)return;
  cnt++;const b=l.reduce((a,c)=>c[0]>a[0]?c:a);
  if(keys.includes(x.date)){if(!top||b[0]>top[0])top=b}
  else if(b[0]>pre)pre=b[0]});
 // שיא = הכי כבד בחלון, שגבוה ממה שהיה לפניו, ורק אם עשה את התרגיל יותר מפעם אחת
 if(top&&cnt>=2&&top[0]>pre&&(!best||top[0]>best.kg))
  best={n:EX[id].n,kg:top[0],rp:top[1]}});
return best}

function last7(){const t=nowD();t.setHours(0,0,0,0);
return Array.from({length:7},(_,i)=>{const d=new Date(t);d.setDate(d.getDate()-6+i);
return{k:dkey(d),w:d.getDay()}})}
function weekReport(){const S3=sets(),days=last7(),ks=days.map(x=>x.k);
const c=k=>({dn:days.filter(x=>S3[k].has(x.k)).length,pl:days.filter(x=>isPl(k,x.k,x.w)).length});
const g=c('gym'),f=c('foot'),sh=c('shot'),fu=c('fuel'),tm=c('team');
const L=['אורי · שבוע '+progWeek()+(progWeek()<=12?' מתוך 12':''),''];
L.push('כוח '+g.dn+'/'+g.pl+' · רגליים '+f.dn+'/'+f.pl+' · קליעה '+sh.dn+'/'+sh.pl+' · אוכל '+fu.dn+'/'+fu.pl);
if(tm.pl||tm.dn)L.push('אימון קבוצה · הגעתי '+tm.dn+' מתוך '+tm.pl);
{const pd=ks.filter(pausedOn);
 if(pd.length){const rs=[...new Set((S.pauses||[]).filter(p=>!p.x&&pd.some(k=>dnum(k)>=dnum(p.f)&&dnum(k)<=dnum(p.t))).map(p=>pauseName(p.r)))];
  L.push('הפסקה · '+pd.length+' ימים · '+rs.join(', '))}}
if(S.bw.length){const n=S.bw[S.bw.length-1].kg;
 let t='משקל '+n+' ק״ג';
 if(S.bw.length>1){const d=Math.round((n-S.bw[0].kg)*10)/10;t+=' ('+(d>=0?'+':'')+d+' מאז ההתחלה)'}
 L.push(t)}
{const w=sleepWeek();
 if(w.n)L.push('שינה · ממוצע '+w.avg+' שעות · '+w.ok+' מתוך '+w.n+' לילות בטווח');
 else L.push('שינה · לא נרשמה השבוע');}
const pr=weekPR(ks);
if(pr)L.push('שיא חדש · '+pr.n+' '+pr.kg+'×'+pr.rp);
const it=days.filter(x=>(S.intentDays||[]).includes(x.k)).length;
if(it)L.push('כוונה לאימון קבוצה · '+it+' מתוך '+days.filter(x=>isPl('team',x.k,x.w)).length);
(S.games||[]).filter(x=>ks.includes(x.d)&&x.lg).forEach(x=>{
 const mb=(MINB.find(m=>m[0]===x.mb)||MINB[0])[1];
 L.push('','משחק '+fmt(x.d)+(x.opp?' מול '+x.opp:'')+' · '+mb);
 if(x.mb===0){if(x.saw)L.push('\u2192 '+chipName(x.saw))}
 else{if(x.good)L.push('\u2713 '+chipName(x.good));
      if(x.fix)L.push('\u2192 '+chipName(x.fix))}});
if(focusOn())L.push('','הדגש עד המשחק הבא: '+chipName(S.focus.c));
{const cl=(S.focusLog||[]).slice(-3);
 if(cl.length)L.push('דגשים שנסגרו: '+cl.map(x=>chipName(x.c)).join(' · '));}
{const w4=(S.weeks||[]).filter(x=>!x.est).slice(-4);
 if(w4.length>=2){L.push('','\u2014 ארבעת השבועות האחרונים');
  w4.forEach(x=>{const pct=k=>x[k][1]?Math.round(x[k][0]/x[k][1]*100):0;
   L.push(fmt(x.w)+' · כוח '+x.gym[0]+'/'+x.gym[1]+' · רגליים '+x.foot[0]+'/'+x.foot[1]
    +' · קליעה '+x.shot[0]+'/'+x.shot[1]+' · אוכל '+x.fuel[0]+'/'+x.fuel[1]
    +(x.bw?' · '+x.bw+' ק״ג':''))});}}
/* \u05de\u05d2\u05de\u05d4 \u05dc\u05ea\u05e8\u05d2\u05d9\u05dc \u2014 \u05dc\u05e2\u05d5\u05d3\u05d3 \u05d1\u05dc\u05d1\u05d3, \u05de\u05d0\u05d5\u05ea\u05d4 \u05e1\u05d9\u05d1\u05d4: \u05d2\u05e8\u05e3 \u05e9\u05d8\u05d5\u05d7 \u05e9\u05de\u05d3\u05d1\u05e8 \u05d0\u05dc \u05d9\u05dc\u05d3 \u05d1\u05dc\u05d9 \u05de\u05ea\u05d5\u05d5\u05da
   \u05d4\u05d5\u05d0 \u05d1\u05d3\u05d9\u05d5\u05e7 \u05d4\u05de\u05e1\u05e4\u05e8 \u05e9\u05db\u05d5\u05d0\u05d1. \u05db\u05d0\u05df \u05d4\u05d5\u05d0 \u05de\u05d9\u05d3\u05e2 \u05e9\u05de\u05d0\u05e4\u05e9\u05e8 \u05dc\u05d4\u05ea\u05e2\u05e8\u05d1. */
{const tr=exTrend();
 if(tr.length){L.push('','\u2014 \u05de\u05d2\u05de\u05d4 \u05dc\u05ea\u05e8\u05d2\u05d9\u05dc');
  tr.forEach(x=>L.push(x.n+' \u00b7 '+x.a+' \u2192 '+x.b+' \u05e7\u05f4\u05d2'
   +(x.stall?' \u00b7 \u05ea\u05e7\u05d5\u05e2 '+x.stall+' \u05d0\u05d9\u05de\u05d5\u05e0\u05d9\u05dd':'')));}}
/* \u05de\u05d2\u05de\u05ea \u05d4\u05e9\u05d9\u05e0\u05d4 \u05e0\u05e9\u05dc\u05d7\u05ea \u05dc\u05e2\u05d5\u05d3\u05d3 \u05d1\u05dc\u05d1\u05d3. \u05d1\u05d0\u05e4\u05dc\u05d9\u05e7\u05e6\u05d9\u05d4 \u05d0\u05d5\u05e8\u05d9 \u05e8\u05d5\u05d0\u05d4 \u05e8\u05e7 \u05d0\u05ea \u05d4\u05e9\u05d1\u05d5\u05e2 \u05d4\u05e0\u05d5\u05db\u05d7\u05d9. */
{const rows=[];
 for(let b=3;b>=1;b--){const w=sleepWeek(b);
  if(w.n)rows.push(fmt(w.rows[0].k)+' \u00b7 \u05de\u05de\u05d5\u05e6\u05e2 '+w.avg+' \u00b7 \u05d1\u05d8\u05d5\u05d5\u05d7 '+w.ok+'/'+w.n)}
 if(rows.length)L.push('','\u2014 \u05e9\u05d9\u05e0\u05d4, \u05e9\u05d1\u05d5\u05e2\u05d5\u05ea \u05e7\u05d5\u05d3\u05de\u05d9\u05dd',...rows);}
L.push('',fmt(ks[0])+' \u2013 '+fmt(ks[6]));
return L.join('\n')}

   שישי בבוקר, אחרי שירותים ולפני אוכל — כדי שתיכנס לדוח של מוצ״ש.
   הכרטיס מופיע משישי ב-05:00 ועד שנרשמה שקילה לשבוע הזה, וחוזר בכל פתיחה.
   "אחר כך" מסתיר עד הפתיחה הבאה. כרטיס ולא חלון חוסם: הסנכרון קורה כשאורי
   פותח את האפליקציה, ואסור שמשהו יגרום לו להימנע מלפתוח אותה.
   לא נשקל עד סוף ראשון — הכרטיס נעלם, והשבוע נשאר "לא נשקל". בלי מספר יעד. */
let weighLater=false,missLater=false;
/* חלון השקילה הוא שני עד ראשון: ראשון הוא יום ההשלמה של השבוע שנגמר, ולכן
   שקילה בראשון שייכת לשבוע הקודם — גם כאן וגם בדוח (אותו חלון בשרת).
   בלי זה שקילת השלמה בראשון הייתה "סוגרת" מראש את השישי שאחריה. */
function weighKeys(){const d=nowD(),w=d.getDay();
if((w===5&&d.getHours()>=5)||w===6)return weekDays(0).map(x=>x.k).slice(1);
if(w===0)return weekDays(1).map(x=>x.k).slice(1).concat([today()]);
return null}
function weighDue(){const ks=weighKeys();if(!ks||pausedOn(today()))return false;
return !(S.bw||[]).some(x=>ks.includes(x.d))}

function fixSleep(){const cur=sleepOf(today());
openSheet(`<div class="grab"></div><div class="h2">כמה שעות ישנת הלילה?</div>
<div class="sub">בערך מספיק. אף אחד לא מודד בשניות.</div>
<div class="slb" style="margin-top:16px">${SLEEPB.map(s=>
`<button class="${s[0]===cur?'on':''}" aria-label="${s[2]}" onclick="closeSheet();setSleep('${s[0]}')"><span class="ltr">${s[1]}${s[0]==='s9'?'+':''}</span></button>`).join('')}</div>
<button class="ghost" style="margin-top:14px" onclick="closeSheet()">ביטול</button>`)}
function openWake(){const cur=WAKES.includes(S.wake)?S.wake:WAKE_DEF;
openSheet(`<div class="grab"></div><div class="h2">מתי אתה קם?</div>
<div class="sub">שעת המיטה נגזרת ממנה: שמונה שעות לפני.</div>
<div class="wk2">${WAKES.map(w=>`<button class="chp ${w===cur?'on':''}" onclick="setWake('${w}')"><span class="ltr">${w}</span></button>`).join('')}</div>
<button class="ghost" style="margin-top:14px" onclick="closeSheet()">סגור</button>`)}

toast('במיטה ב-'+hhmm(bedMin()))}
/* רישום בדיעבד של לילות חסרים. הרשימה נלקחת ברגע הפתיחה, כך שלילה שנרשם
   נשאר על המסך בזהב — רואים שזה נקלט — עד שסוגרים. */
let missList=[];
function openMissing(){missList=missingNights().slice().reverse();drawMissing()}
function drawMissing(){
openSheet(`<div class="grab"></div><div class="h2">לילות חסרים</div>
<div class="sub">כמה ישנת בכל לילה? בערך מספיק.</div>
<div style="margin-top:16px">${missList.length?missList.map(k=>{const b=sleepOf(k);
 return `<div class="sldy"><div class="sln${b?' got':''}">${b?'✓ ':''}בין ${dayName(addDaysK(k,-1))} ל${dayName(k)} <span class="tiny">· <span class="ltr">${fmt(k)}</span></span></div>
<div class="slb">${SLEEPB.map(s=>`<button class="${s[0]===b?'on':''}" aria-label="${s[2]}" onclick="missSet('${k}','${s[0]}')"><span class="ltr">${s[1]}${s[0]==='s9'?'+':''}</span></button>`).join('')}</div></div>`}).join('')
 :'<div class="cue">אין לילות חסרים מהשבוע האחרון.</div>'}</div>
<button class="big" style="margin-top:18px" onclick="closeSheet();draw()">סיימתי</button>`)}
function missSet(k,b){if(putSleep(k,b))drawMissing()}

function sleepLine(w){
if(!w.n)return 'עוד לא רשמת אף לילה השבוע. תקתוק אחד בבוקר, שנייה אחת.';
if(w.ok>=6)return 'זה כבר לא מקרה. הגוף מקבל בדיוק את מה שהוא צריך כדי לבנות.';
if(w.ok>=3)return 'חצי מהשבוע בטווח. החצי השני הוא כל ההבדל.';
if(w.ok>=1)return 'לילה או שניים בטווח. בשאר הלילות הגוף עוד מחכה.';
return 'אף לילה לא הגיע לשמונה. זה הדבר הכי זול שאתה יכול לשנות.'}
function sleepChart(){const w=sleepWeek(),D=['א','ב','ג','ד','ה','ו','ש'];
return `<div class="card">
<div class="row" style="align-items:baseline">
<div style="font-weight:800;font-size:15px">השבוע בשינה</div>
<div style="font-size:13px;font-weight:800;color:${w.ok>=5?'var(--ok)':'var(--t3)'}">
<span class="ltr">${w.ok}</span> ${w.ok===1?'לילה':'לילות'} בטווח</div></div>
<div class="slc">
<div class="slbars">
${w.rows.map(r=>{const h=r.b?sleepHrs(r.b):0;
 const cls=r.b?(h>=SLEEP_OK?'ok':'low'):(r.fut?'fut':'none');
 return `<div class="slbar"><i class="${cls}" style="height:${h?Math.round(h/10*100):0}%"></i></div>`}).join('')}
<div class="sltg"></div></div>
<div class="sldls">${w.rows.map(r=>`<div class="sldl${r.today?' t':''}">${D[r.w]}</div>`).join('')}</div>
<div class="sltgl"><i></i>היעד — <span class="ltr">8</span> שעות</div></div>
<div class="cue" style="margin-top:12px">${sleepLine(w)}</div>
${sleepOf(today())?`<div style="text-align:center;margin-top:6px"><button class="tiny" style="color:var(--t2);text-decoration:underline;padding:12px 16px;min-height:44px" onclick="fixSleep()">לשנות את הלילה האחרון</button></div>`
:`<button class="act solid" style="width:100%;margin-top:12px" onclick="fixSleep()">תרשום את הלילה</button>`}
${(()=>{const n=missingNights().length;return n?`<button class="act" style="width:100%;margin-top:8px" onclick="openMissing()">לילות חסרים · <span class="ltr">${n}</span></button>`:''})()}</div>`}

function week7Card(){return `<div class="warnbox"><b>שבוע 7 — שבוע הקלה</b>
<p><b>סט אחד פחות בכל תרגיל, אותו משקל בדיוק.</b> זה לא חופש, זה השבוע שבו הגוף סוגר פערים.</p></div>`}

/* תקציב כרטיסים: עד שניים דחופים ועד שניים לטווח ארוך.
   מה שלא נכנס היום — יעלה מחר, כשמשהו אחר ייסגר. */
/* כרטיס השקילה יושב בראש המסך ונספר בתקציב: כשהוא מופיע נשאר מקום לאחד.
   בזמן הפסקה אין תזכורות דיווח בכלל. */
function weighShown(){return !isDayOne()&&!weighLater&&weighDue()}
function homeUrgent(){const out=[];
if(isDayOne())return onboardCard();
if(pausedOn(today()))return '';
if(progWeek()===6)out.push(week6Card());
if(progWeek()===7)out.push(week7Card());
if(pendingGame())out.push(gamePrompt());
if(measureDue())out.push(measureCard());
if(!missLater&&missingNights().length>2)out.push(missCard());
if(htDue()&&!weighDue())out.push(htCard());
return out.filter(Boolean).slice(0,weighShown()?1:2).join('')}
function homeHorizon(){const out=[];
if(nextGame())out.push(nextGameCard());
if(focusOn())out.push(focusCard());
const c=coachCard();if(c)out.push(c);
return out.filter(Boolean).slice(0,2).join('')}

return `<div class="wrap">

${DEVOFF?`<div onclick="openDev()" style="margin-top:10px;border:1px solid var(--red);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800;color:var(--red2)">מצב בדיקה · הסטה של <span class="ltr">${DEVOFF}</span> ימים</div>`:''}

${p[1]?`<div class="sub" style="margin-top:2px">${p[1]}</div>`:''}
</div></div>

<div><div class="v ltr">${S.sessions.length}</div><div class="k">אימוני כוח</div></div>
<div><div class="v ltr">${bw}</div><div class="k">משקל ק״ג</div></div>
</div></div>

${(S.cur&&open)?`<div class="card" style="border:1px solid var(--red);margin-top:12px">

<button class="act" onclick="askDrop()">בטל</button></div></div>`
:(gymToday?`<button class="big" style="margin-top:12px" onclick="goTrain('gym')">התחל אימון ${nextW()}</button>`:'')}

<div style="text-align:center;margin-top:14px">

:`<button class="tiny" style="color:var(--t3);text-decoration:underline;padding:12px 16px;min-height:44px" onclick="openToday()">היום זה לא מתאים</button>`}</div>
<div class="two2">
<button class="mini" onclick="openRules()">עשרת חוקי הזהב</button>
<button class="mini" onclick="openTips()">טיפים מקצועיים</button>
</div>
</div>`}

/* ---------- מסך פיתוח ----------
   שבע נגיעות על תג השבוע. ההסטה חיה ב-sessionStorage בלבד, ולכן
   נעלמת עם סגירת הלשונית ואי אפשר להשאיר אותה דלוקה בטעות. */
let devTaps=0,devT=null;
function devTap(){devTaps++;if(devT)clearTimeout(devT);
devT=setTimeout(()=>{devTaps=0},1400);
if(devTaps>=7){devTaps=0;openDev()}}
function setDev(n){const v=Math.max(-400,Math.min(400,parseInt(n,10)||0));
DEVOFF=v;try{sessionStorage.setItem('uridev',String(v))}catch(e){}
closeSheet();draw();toast(v?'הסטה: '+v+' ימים':'חזרנו להיום')}
function openDev(){openSheet(`<div class="grab"></div><div class="h2">מסך פיתוח</div>
<div class="sub">הסטת תאריך לבדיקה. נמחקת לבד כשסוגרים את הלשונית.</div>
<div class="card" style="margin-top:14px">
<div class="cue">היום לפי האפליקציה</div>
<div style="font-size:19px;font-weight:900;margin-top:4px"><span class="ltr">${today()}</span> · יום ${['א','ב','ג','ד','ה','ו','ש'][nowD().getDay()]}</div>
<div class="cue" style="margin-top:6px">הסטה נוכחית: <span class="ltr">${DEVOFF}</span> ימים · שעה <span class="ltr">${nowD().getHours()}</span></div></div>
<div class="slb" style="margin-top:12px">
<button onclick="setDev(${DEVOFF-7})"><span class="ltr">-7</span></button>
<button onclick="setDev(${DEVOFF-1})"><span class="ltr">-1</span></button>
<button onclick="setDev(0)">היום</button>
<button onclick="setDev(${DEVOFF+1})"><span class="ltr">+1</span></button>
<button onclick="setDev(${DEVOFF+7})"><span class="ltr">+7</span></button></div>
<div class="card" style="margin-top:12px">
<div class="cue">שינה · רצף הכי ארוך בטווח: <span class="ltr">${sleepRun()}</span> · לילות רשומים: <span class="ltr">${(S.sleep||[]).length}</span></div>
<div class="cue" style="margin-top:4px">רצף ימים: <span class="ltr">${dayStreak().n}</span> · שבוע תוכנית: <span class="ltr">${progWeek()}</span> · יום קל: ${lightWhy()||'לא'}</div>
<div class="cue" style="margin-top:4px">חיבור לדוח: ${paired()?'מחובר':'לא מחובר'}${syncSt().at?' · עותק אחרון '+agoText(syncSt().at):''}${syncSt().err?' · שגיאה <span class="ltr">'+esc(syncSt().err)+'</span>':''} · במצב בדיקה לא נשלח כלום</div>
<div class="cue" style="margin-top:4px">הפסקה: ${activePause()?'עד '+fmt(activePause().t):'לא'} · לילות חסרים: <span class="ltr">${missingNights().length}</span> · שקילה: ${weighDue()?'ממתינה':'לא עכשיו'}</div></div>
<button class="ghost" style="margin-top:14px" onclick="closeSheet()">סגור</button>`)}

function gamePrompt(){const g=pendingGame();if(!g)return '';
return `<div class="gcard">
<div class="nm">המשחק מ-${fmt(g.d)}${g.opp?' מול '+esc(g.opp):''}</div>
<div class="cue" style="margin-top:4px">שלוש שורות כשנוח לך. לא חייב עכשיו.</div>
<div class="iact" style="margin-top:11px">
<button onclick="snoozeGame('${g.d}')">אחר כך</button>
<button class="go" onclick="askGame('${g.d}')">תרשום</button></div></div>`}

function nextGameCard(){const g=nextGame();if(!g)return '';
const n=Math.round((dnum(g.d)-dnum(today()))/864e5);
const when=n===0?'היום':(n===1?'מחר':'בעוד '+n+' ימים');
const f=focusOn();
return `<div class="ngame" onclick="editGame('${g.d}')">
<div class="ngh">המשחק הבא</div>
<div class="ngt">${when}${g.opp?' · '+esc(g.opp):''}</div>
<div class="ngd">${fmt(g.d)} · ${g.home?'בית':'חוץ'}</div>
${n===0&&f?`<div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--c2);
font-size:14px;font-weight:800;color:var(--ok)">המשימה היום: ${chipName(f.c)}</div>`:''}
${n===0?anchorLine():''}</div>`}
/* העוגן. פעולה, לא מחשבה — בן 14 באמצע משחק לא מעבד, הוא זז.
   מופיע ביום משחק בלבד, ואותו נוסח בדיוק בכל פעם. הערך שלו בעקביות. */
function anchorLine(){return `<div class="anch">
<div class="anh">אחרי טעות</div>
<div class="ant">כף אחת, ואז ידיים למעלה.</div>
<div class="ans">הכף סוגרת את הטעות. הידיים אומרות שאתה עדיין רוצה את הכדור.</div></div>`}

function planText(){const P=stampToday(),d=nowD().getDay(),t=(S.times||{})[d];
const pz=activePause();
if(pz)return ['הפסקה','עד יום '+dayName(pz.t)+' · <span class="ltr">'+fmt(pz.t)+'</span>'];
const g=(S.games||[]).find(x=>x.d===today());
if(g)return ['משחק'+(g.opp?' מול '+esc(g.opp):''),'היום סופרים אותך'];
// הכותרת נותנת את ההקשר של היום. הפירוט יושב ברשימה מתחתיה — אין טעם לומר אותו פעמיים.
if(P.team)return ['אימון קבוצה',t?'<bdi>'+esc(t)+'</bdi>':''];
if(P.gym)return ['יום כוח',''];
if(P.shot||P.foot)return ['יום אישי',''];
return ['מנוחה מלאה','כלום מתוכנן היום']}

function intentCard(){if(!isTeamDay())return '';
const it=intentToday(),on=intentDone();
return `<div class="intent ${on?'on':''}">
<div class="ih">${on?'\u2713 הכוונה שלך להיום':'הכוונה להיום · '+it[0]}</div>
<div class="it">${it[1]}</div>
${on?'':`<div class="iact">
<button onclick="shuffleIntent()">כוונה אחרת</button>
<button class="go" onclick="takeIntent()">לוקח את זה</button></div>`}
${teamRow()}</div>`}

let schDay=0;
function openSched(){schDay=nowD().getDay();drawSched()}
function drawSched(){const d=schDay;
openSheet(`<div class="grab"></div><div class="h2">המערכת שלי</div>
<div class="sub">מה יש בכל יום. שינוי תופס מהיום והלאה — מה שכבר נרשם לא משתנה.</div>
<div class="dsel">${DL.map((n,i)=>`<button class="dbt ${i===d?'on':''}" onclick="schPick(${i})">${n}</button>`).join('')}</div>
${SKEYS.map(k=>{const on=SCHED[k].includes(d);
return `<button class="srow ${on?'on':''}" onclick="schTog('${k}')">
<span class="sbox">${on?'\u2713':''}</span><span class="snm">${SNAME[k]}</span></button>`}).join('')}
${SCHED.team.includes(d)?`<div style="margin-top:12px">
<label style="display:block;font-size:12px;color:var(--t2);margin-bottom:5px">שעת אימון הקבוצה</label>
<input class="fin" id="stime" type="text" value="${esc((S.times||{})[d]||'')}" placeholder="17:30-19:00"
onchange="schTime(this.value)" style="direction:ltr;text-align:center"></div>`:''}
<button class="big" style="margin-top:14px" onclick="closeSheet()">סיימתי</button>`)}
function schPick(i){schDay=i;drawSched()}
function schTog(k){const a=S.sched[k]||[],i=a.indexOf(schDay);
i<0?a.push(schDay):a.splice(i,1);a.sort((x,y)=>x-y);
S.sched[k]=a;syncSched();
const t=today();
if(schDay===nowD().getDay()&&S.dayplan&&S.dayplan[t])S.dayplan[t][k]=a.includes(schDay);
save();drawSched();draw()}
function schTime(v){if(!S.times)S.times={};S.times[schDay]=String(v).slice(0,20);save();draw()}

function openToday(){const P=stampToday();
openSheet(`<div class="grab"></div><div class="h2">היום זה לא מתאים</div>
<div class="sub">שינוי להיום בלבד. המערכת הקבועה נשארת כמו שהיא.</div>
<div style="height:14px"></div>
${SKEYS.map(x=>{const on=!!P[x];
return `<button class="srow ${on?'on':''}" onclick="togToday('${x}')">
<span class="sbox">${on?'\u2713':''}</span><span class="snm">${SNAME[x]}</span></button>`}).join('')}
<button class="ghost" style="margin-top:12px" onclick="resetToday()">חזרה למערכת הקבועה</button>
<button class="big" style="margin-top:8px" onclick="closeSheet()">סיימתי</button>
<button class="ghost" onclick="openPause()">חולה או במבחנים כמה ימים? הפסקה</button>`)}
function togToday(x){const k=today();stampToday();
S.dayplan[k][x]=!S.dayplan[k][x];save();draw();openToday()}
function resetToday(){const k=today();
if(S.dayplan)delete S.dayplan[k];stampToday();save();draw();openToday()}

/* ---------- הפסקה ----------
   חולי, מבחנים, חופשה או אחר · 3, 7 או 14 ימים · בלי טקסט חופשי.
   מתחילה היום ונגמרת לבד. הפעלה מנסה לשלוח עותק מיד, כדי שעודד יקבל מייל
   עם הסיבה ותאריך הסיום בלי לחכות לסנכרון היומי. */
let pDraft={r:'',n:0};
function openPause(){if(activePause()){askEndPause();return}
pDraft={r:'',n:0};drawPause()}
function drawPause(){const end=pDraft.n?addDaysK(today(),pDraft.n-1):'';
openSheet(`<div class="grab"></div><div class="h2">הפסקה</div>
<div class="sub">כשאתה חולה, במבחנים או בחופשה. ימי ההפסקה לא נספרים כפספוס, והיא נגמרת לבד.${paired()?' עודד מקבל הודעה.':''}</div>
<div class="sec" style="margin-top:16px">למה</div>
<div class="chips">${PAUSE_R.map(r=>`<button class="chp ${pDraft.r===r[0]?'on':''}" onclick="pPick('r','${r[0]}')">${r[1]}</button>`).join('')}</div>
<div class="sec">כמה זמן</div>
<div class="chips">${PAUSE_LEN.map(n=>`<button class="chp ${pDraft.n===n?'on':''}" onclick="pPick('n',${n})"><span class="ltr">${n}</span> ימים</button>`).join('')}</div>
${end?`<div class="cue" style="margin-top:14px;font-size:14px;color:#DCDCE0">עד יום ${dayName(end)} · <span class="ltr">${fmt(end)}</span>, כולל.</div>`:''}
<button class="big" style="margin-top:16px" ${pDraft.r&&pDraft.n?'':'disabled'} onclick="startPause()">הפעל הפסקה</button>
<button class="ghost" onclick="closeSheet()">ביטול</button>`)}
function pPick(f,v){pDraft[f]=v;drawPause()}
function startPause(){const r=pDraft.r,n=pDraft.n;
if(!PAUSE_R.some(x=>x[0]===r)||!PAUSE_LEN.includes(n)||activePause())return;
const f=today(),t=addDaysK(f,n-1);
if(!Array.isArray(S.pauses))S.pauses=[];
S.pauses.push({a:nowD().getTime(),f,t,r,x:0});

/* ---------- gym ---------- */
function curW(){return S.cur?S.cur.w:nextW()}
function ensure(){if(!S.cur)S.cur={date:today(),w:nextW(),log:{}}}
function gymSets(){const ids=curW()==='A'?WA:WB;
const tot=ids.reduce((a,id)=>a+EX[id].s,0);
const dn=(S.cur&&S.cur.date===today())?Object.values(S.cur.log).flat().filter(Boolean).length:0;
return[dn,tot]}
let exIdx=-1,gymList=false;
/* בדיקת התאריך חייבת להיות כאן בדיוק כמו ב-gymSets. בלעדיה אימון פתוח
   מאתמול מציג את הסטים של אתמול כסגורים, והמסך נותן שני מספרים סותרים. */
function exDone(id){const lg=(S.cur&&S.cur.date===today()&&S.cur.log[id])||[];
return lg.filter(Boolean).length}
function nextOpen(ids){for(let i=0;i<ids.length;i++)if(exDone(ids[i])<EX[ids[i]].s)return i;return -1}
function exAt(ids){if(exIdx>=0&&exIdx<ids.length)return exIdx;
const n=nextOpen(ids);return n<0?ids.length-1:n}
function exGo(d){const ids=curW()==='A'?WA:WB;
exIdx=Math.max(0,Math.min(exAt(ids)+d,ids.length-1));draw();window.scrollTo(0,0)}
function exJump(i){exIdx=i;gymList=false;draw();window.scrollTo(0,0)}
function toggleGymList(){gymList=!gymList;draw();window.scrollTo(0,0)}

function bodyGym(){ensure();const ids=curW()==='A'?WA:WB;
return gymList?listGym(ids):focusGym(ids)}

function focusGym(ids){const i=exAt(ids),id=ids[i],e=EX[id];
const dn=exDone(id),lg=(S.cur.log[id]||[]),lp=lastFor(id);
const tot=ids.reduce((a,x)=>a+EX[x].s,0);
const done=ids.reduce((a,x)=>a+exDone(x),0);
const all=done>=tot;
return `${(i===0&&!done)?`<div class="card" style="margin-top:12px" onclick="openWarm()">
<div class="row"><div class="nm">חימום קבוע</div><div class="cq" style="font-size:15px">6 דק׳</div></div>
<div class="cue">5 תרגילים · לחץ לפרטים</div></div>`:''}
<div class="fxhead"><span>תרגיל <span class="ltr">${i+1}</span> מתוך <span class="ltr">${ids.length}</span>
<button onclick="flip()" style="color:var(--t2);text-decoration:underline;padding:8px 6px;min-height:44px">אימון ${curW()==='A'?'B':'A'}</button></span>
<button onclick="toggleGymList()" style="color:var(--t2);text-decoration:underline;padding:8px 4px;min-height:44px">כל האימון</button></div>
<div class="fxbar"><i style="width:${Math.round(done/tot*100)}%"></i></div>
<div class="fxcard">
<div class="fxname" onclick="openEx('${id}')">${e.n}</div>
<div class="fxcue">${e.cue}</div>
<div class="fxtar"><span class="ltr">${e.s} × ${e.r}</span></div>
${lp?`<div class="last">אחרונה: <span class="ltr">${lp[0]}</span> ק״ג <span class="ltr">× ${lp[1]}</span></div>`
   :'<div class="last">פעם ראשונה — תתחיל קל</div>'}
${exStall(id)?`<div class="stall">אותו משקל <span class="ltr">${exStall(id)}</span> אימונים.
תוסיף חזרה אחת לסט לפני שאתה מוסיף משקל.</div>`:''}
<div class="sets">${Array.from({length:e.s},(_,k)=>{const v=lg[k];
return `<button class="set ${v?'on':''}" onclick="tapSet('${id}',${k})">${v?`<span class="ltr">${v[0]}×${v[1]}</span>`:'סט '+(k+1)}</button>`}).join('')}</div>
<div class="acts">
${e.v?`<button class="act" onclick="vid('${e.v}')">▶ טכניקה${e.d?` · ${e.d} שנ׳`:``}</button>`:''}
<button class="act" onclick="startT(${e.rest})">מנוחה ${Math.floor(e.rest/60)}:${String(e.rest%60).padStart(2,'0')}</button>
</div></div>
<div class="fxnav">
<button class="${i===0?'off':''}" onclick="exGo(-1)">הקודם</button>
${i<ids.length-1?`<button class="${dn>=e.s?'go':''}" onclick="exGo(1)">${dn>=e.s?'לתרגיל הבא':'דלג'}</button>`
 :`<button class="${all?'fin':'go'}" onclick="finish()">סיימתי את האימון</button>`}</div>
${all&&i<ids.length-1?`<button class="big" style="margin-top:10px" onclick="finish()">סיימתי את האימון</button>`:''}
<div class="tiny" style="text-align:center;margin-top:11px">בפעם הבאה תקבל אימון ${curW()==='A'?'B':'A'}</div>
<div class="notes"><button class="note" onclick="nShort()">אין לי זמן היום</button>
<button class="note warn" onclick="nPain()">אם כואב — מה יורד ראשון</button></div>`}

function listGym(ids){const w=curW();
return `<div class="fxhead"><span>כל האימון</span>
<button onclick="toggleGymList()" style="color:var(--t2);text-decoration:underline;padding:8px 4px;min-height:44px">חזרה לתרגיל</button></div>
${ids.map((id,i)=>{const e=EX[id],dn=exDone(id),fin=dn>=e.s;
return `<button class="tdi" onclick="exJump(${i})">
<span class="tdt"><b>${fin?'\u2713 ':''}${e.n}</b><i><span class="ltr">${dn}</span>/<span class="ltr">${e.s}</span> סטים</i></span>
<span class="tdm"><span class="ltr">${e.s} × ${e.r}</span></span></button>`}).join('')}
<button class="big" style="margin-top:12px" onclick="finish()">סיימתי את האימון</button>`}

function flip(){ensure();const n=Object.values(S.cur.log).flat().filter(Boolean).length;
if(!n){doFlip();return}
openSheet(`<div class="grab"></div><div class="h2">להחליף לאימון ${S.cur.w==='A'?'B':'A'}?</div>
<div class="sub"><span class="ltr">${n}</span> הסטים שרשמת באימון ${S.cur.w} יימחקו.</div>
<div style="height:16px"></div>
<button class="big" onclick="doFlip()">כן, החלף</button>
<button class="ghost" onclick="closeSheet()">לא, תחזור</button>`)}
function doFlip(){ensure();S.cur.w=S.cur.w==='A'?'B':'A';S.cur.log={};exIdx=-1;gymList=false;save();closeSheet();draw()}
function vid(v){window.open('https://www.youtube.com/watch?v='+v,'_blank')}

let sheetCtx=null;
function tapSet(id,k){ensure();sheetCtx={id,k};const e=EX[id];const lg=S.cur.log[id]||[];
const sg=(k===0&&!lg.length)?suggestKg(id):null;
const prev=lg[k]||lg[k-1]||(sg?[sg,e.r]:null)||lastFor(id)||[0,e.r];
openSheet(`<div class="grab"></div>
<div class="h2">${e.n}</div><div class="sub">סט ${k+1} מתוך ${e.s}</div>
${sg?`<div class="warnbox" style="margin-top:12px"><b>הגיע הזמן להוסיף משקל</b>
<p>בפעם הקודמת השלמת את כל ${e.s} הסטים ב-${e.r} חזרות. הצעתי לך <span class="ltr">${sg}</span> ק״ג. אם זה מרגיש כבד מדי — תרד, זה לא ציון.</p></div>`:''}
<div class="num">
<div><label>משקל (ק״ג)</label><input id="ikg" type="number" inputmode="decimal" value="${prev[0]||''}"></div>
<div><label>חזרות</label><input id="irp" type="number" inputmode="numeric" value="${prev[1]||e.r}"></div>
</div>
<button class="big" onclick="saveSet()">שמור והתחל מנוחה</button>
<button class="ghost" onclick="clrSet()">נקה סט</button>`)}
function saveSet(){const{id,k}=sheetCtx;
const kg=parseFloat(document.getElementById('ikg').value);
const rp=parseInt(document.getElementById('irp').value);
if(!numOk(kg,0,300)){toast('משקל לא הגיוני — בין 0 ל-300');return}
if(!numOk(rp,1,200)){toast('חזרות חייבות להיות לפחות 1');return}
ensure();if(!S.cur.log[id])S.cur.log[id]=[];S.cur.log[id][k]=[kg,rp];save();closeSheet();draw();startT(EX[id].rest)}
function clrSet(){const{id,k}=sheetCtx;if(S.cur.log[id])delete S.cur.log[id][k];save();closeSheet();draw()}
function finish(){if(!S.cur||!Object.values(S.cur.log).flat().filter(Boolean).length){toast('לא רשמת אף סט');return}
S.cur.log=Object.fromEntries(Object.entries(S.cur.log).map(([k,v])=>[k,v.filter(Boolean)]));
const allSets=Object.values(S.cur.log).flat();
const vol=Math.round(allSets.reduce((a,b)=>a+b[0]*b[1],0));
const w=S.cur.w;S.sessions.push(S.cur);S.cur=null;exIdx=-1;gymList=false;save();
const n=S.sessions.length,st=streak();
openSheet(`<div class="grab"></div>
<div style="text-align:center;padding:6px 0 4px">
<div style="font-size:44px;font-weight:900;color:var(--red2);line-height:1" class="ltr">${n}</div>
<div class="sub" style="margin-top:4px">האימון ה-${n} שלך</div>
<div class="h2" style="margin-top:14px">אימון ${w} הושלם</div></div>
<div class="stat" style="margin:16px 0 4px">
<div><div class="v ltr">${allSets.length}</div><div class="k">סטים</div></div>
<div><div class="v ltr">${vol}</div><div class="k">נפח ק״ג</div></div>
<div><div class="v ltr">${st}</div><div class="k">רצף</div></div></div>
<div class="tiny" style="text-align:center;margin:14px 0 4px">בפעם הבאה: אימון ${w==='A'?'B':'A'}</div>
<button class="big" style="margin-top:12px" onclick="sheetDone('prog')">לראות את המספרים</button>
<button class="ghost" onclick="sheetDone('home')">סגור</button>`)}


function openWarm(){openSheet(`<div class="grab"></div><div class="h2">חימום קבוע · 6-8 דקות</div>
<div class="sub">זהה בכל אימון · הקפיצות רק בימי A</div><div style="height:14px"></div>
${WARMUP.map(w=>`<div class="chk"><div class="ct"><b>${w[0]}</b><div class="cue">${w[1]}</div></div>
<div class="qw"><div class="cq">${w[2]}</div>${w[3]?`<button class="vi" onclick="vid('${w[3]}')">\u25B6</button>`:''}</div></div>`).join('')}
<div class="warnbox" style="margin-top:16px"><b>אל תדלג</b><p>כאן נמצאת כל העבודה שמגנה על הברכיים, הקרסוליים והמפשעות.</p></div>
<div class="warnbox" style="margin-top:10px"><b>הקפיצה האנכית — חמישה כללים שאסור לשבור</b>
<p><b>1. כל חזרה בכוונה מקסימלית.</b> חמש חזרות זו לא סדרת כושר. כל אחת היא ניסיון לגעת בנקודה הכי גבוהה שאתה יכול. אם החמישית נמוכה מהראשונה — עצור.<br><br>
<b>2. ירידה מהירה ורדודה.</b> חצי סקוואט זריז, לא צלילה עמוקה ואיטית. עומק הורג את הקפיץ.<br><br>
<b>3. הזרועות זורקות אותך.</b> סוויינג חזק לאחור ואז קדימה־למעלה מוסיף כעשירית מהגובה. רוב הילדים שוכחים מהידיים.<br><br>
<b>4. נחיתה שקטה.</b> אותו מדד בדיוק כמו בבלימה ובנחיתה על רגל אחת.<br><br>
<b>5. אחרי החימום, לפני הסקוואט — לעולם לא בסוף אימון.</b> ואם הברך כואבת, עוצרים. בגיל הזה לא דוחפים דרך כאב.</p></div>`)}

function openEx(id){const e=EX[id];openSheet(`<div class="grab"></div>
<div class="h2">${e.n}</div><div class="sub">${e.e} · <span class="ltr">${e.s} × ${e.r}</span> · מנוחה ${e.rest} שנ׳</div>
<div style="height:16px"></div>
<div class="blk"><h4>איך עושים</h4><ol>${e.how.map(h=>`<li>${h}</li>`).join('')}</ol></div>
<div class="blk"><h4>מה אתה אמור להרגיש</h4><div class="feel"><p>${e.feel}</p></div></div>
<div class="blk"><h4>הטעות הנפוצה</h4><p>${e.mis}</p></div>
<div class="blk"><h4>אם המכשיר תפוס</h4><p>${e.alt}</p></div>
${e.v?`<button class="big" onclick="vid('${e.v}')">▶ טכניקה · ${e.ch}${e.d?` · ${e.d} שנ׳`:``}</button>`:''}`)}

/* ---------- personal ---------- */
function dayList(key,def){if(S[key].d!==today()){S[key]={d:today(),done:[],w:S[key].w||def};save()}return S[key]}
function shootState(){if(S.shoot.d!==today()){const prev=S.shoot.d,
fin=(S.shotDays||[]).includes(prev);
S.shoot={d:today(),w:prev?(fin?(S.shoot.w==='A'?'B':'A'):S.shoot.w):'A',done:[]};save()}
return S.shoot}
let trainTab=null;
function trainBlocks(){const sh=shootState(),g=gymSets();
return{gym:{n:'כוח '+curW(),min:45,done:g[0],tot:g[1],pl:isPl('gym',today(),nowD().getDay())},
 foot:{n:isRestDay()?'רגליים · קל':'רגליים',min:isRestDay()?4:12,
       done:S.foot.d===today()?S.foot.done.length:0,tot:todayFoot().length,
       pl:isPl('foot',today(),nowD().getDay())},
 shoot:{n:'בלוק '+sh.w,min:32,done:sh.done.length,tot:(sh.w==='A'?SHA:SHB).length,
        pl:isPl('shot',today(),nowD().getDay())}}}
function trainActive(){const b=trainBlocks();
if(trainTab&&b[trainTab])return trainTab;
// ברירת מחדל: מה שמתוכנן להיום וטרם נסגר
const order=['foot','gym','shoot'];   // סדר התוכנית: רגליים פותחות, ואז כוח, ואז קליעה
const open=order.filter(k=>b[k].pl&&b[k].done<b[k].tot);
if(open.length)return open[0];
const any=order.filter(k=>b[k].pl);
return any.length?any[0]:'foot'}
function setTrain(t){trainTab=t;draw();window.scrollTo(0,0)}
function goTrain(t){tab='train';trainTab=t;draw();window.scrollTo(0,0)}
/* היעד נלקח מ-TODO ולא מונח מראש. כל שורה ברשימת היום קראה ל-goTrain
   בלי קשר לסוג, ולכן "אוכל" נחת על לשונית האימון — שנופלת לכוח. */
function goTodo(k){const t=TODO[k];if(!t)return;
if(t.tab==='train'){goTrain(k==='shot'?'shoot':k);return}
go(t.tab)}

function vTrain(){dayList('foot');
const b=trainBlocks(),act=trainActive();
const seg=['gym','foot','shoot'].map(k=>{const x=b[k],fin=x.tot&&x.done>=x.tot;
 return `<button class="sg ${act===k?'on':''} ${fin?'fin':''}" onclick="setTrain('${k}')">
<b>${fin?'✓ ':''}${x.n}</b><i><span class="ltr">${x.done}</span>/<span class="ltr">${x.tot}</span> · <span class="ltr">${x.min}</span> דק׳</i></button>`}).join('');
const sub=act==='gym'?'אימון כוח'
 :(isRestDay()&&act==='foot'
   ?({fri:'שישי · 4 דקות בלבד',pre:'לפני משחק · 4 דקות בלבד',post:'אחרי משחק · 4 דקות בלבד'})[lightWhy()]
   :'מה שמתוכנן להיום');
return `<div class="wrap">
<div class="h1" style="font-size:26px">אימון</div>
<div class="sub">${sub}</div><div class="bar"></div>
<div class="seg">${seg}</div>
${act==='gym'?bodyGym():bodyBlock(act,b)}
</div>`}

function bodyBlock(act,b){const cur=b[act];
const list=act==='foot'?todayFoot():(shootState().w==='A'?SHA:SHB);
/* "אין לי זמן היום" הוא המסר שמונע נטישה, והוא היה מחובר לבלוק הקליעה
   בלבד — למרות שהתוכן שלו מדבר על בלוק הרגליים ומסתיים בכפתור אליו.
   מעכשיו הוא זמין מכל שלושת הבלוקים. "למה היום קצר" הוסר: הוא היה
   כפילות מדויקת של התיבה שמוצגת ממילא באותו תנאי, שלוש שורות מעליו. */
const notes=act==='foot'
 ?`<button class="note warn" onclick="nPain()">אם כואב — מה יורד ראשון</button>
<button class="note" onclick="nNoise()">המדד הוא רעש, לא מאמץ</button>
<button class="note" onclick="nShort()">אין לי זמן היום</button>`
 :`<button class="note" onclick="nShort()">אין לי זמן היום</button>
<button class="note" onclick="nFree()">חופשה או חג</button>`;
return `${act==='shoot'?`<div class="row" style="margin:14px 0 2px;align-items:center">
<div class="sub">${b.shoot.n==='בלוק A'?'קליעה וסיום':'תנועה ומסירה'}</div>
<button class="note" style="min-height:34px;padding:7px 11px" onclick="askFlipShoot()">החלף בלוק</button></div>`:''}
${act==='foot'&&isRestDay()?`<div class="warnbox" style="margin:14px 0 2px">
<b>${({fri:'שישי — מנוחה מהעומס, לא מהעבודה',
     pre:'מחר משחק — הרגליים נשארות טריות',
     post:'אתמול היה משחק — היום הרקמות מתאוששות'})[lightWhy()]}</b>
<p>${({fri:'קפיצות, בלימות ונחיתות יורדות היום. שני תרגילים, ארבע דקות, וזהו.',
     pre:'אותה עבודה, בלי קפיצות ונחיתות. הקואורדינציה נשמרת, הקפיץ נשאר למחר.',
     post:'המשחק הוא העומס הכי גבוה בשבוע. היום שני תרגילים בלי עומס, וזהו.'})[lightWhy()]}</p></div>`:''}
<div class="list" style="margin-top:12px">${list.map((x,i)=>ck(act,i,x)).join('')}</div>

/* ---------- חיבור לדוח: צימוד וסנכרון ----------
   כבוי כברירת מחדל. צימוד חד-פעמי בקוד בן 6 ספרות שעודד מקבל במייל, ומוקלד
   כאן — באייפון האפליקציה שבמסך הבית וספארי לא חולקים אחסון, ולכן קישור
   לא היה עובד. המפתח יושב במפתח נפרד ב-localStorage: לא בגיבוי, לא בייצוא
   ולא בשחזור. אחרי הצימוד: עותק פעם ביום, בפתיחה, אחרי שהמסך רונדר, ברקע.
   מצב בדיקה (DEVOFF) לעולם לא שולח. כשל לא מקפיץ טוסט — אחרי 48 שעות בלי
   עותק מופיע בהגדרות "שלח עכשיו". הבטחה שנדחית נבלעת כאן, ובכל מקרה
   unhandledrejection לא מפעיל את רשת הביטחון. */
const SYNC_URL='https://script.google.com/macros/s/AKfycbx4--_d-cm1eixGVzgDTSvKXlHoVd-Qafugk8qYD7voCmP63pT9FPacTj2KLCymD9r1/exec';
const SK='uri1.sync',APP_V='hw-2026-10-11';
function syncSt(){try{const o=JSON.parse(localStorage.getItem(SK)||'null');
return(o&&typeof o==='object'&&!Array.isArray(o))?o:{}}catch(e){return{}}}
function setSyncSt(o){try{localStorage.setItem(SK,JSON.stringify(o))}catch(e){}}
function paired(){const s=syncSt();return typeof s.key==='string'&&s.key.length>=32}
function devLabel(){const u=navigator.userAgent||'';
let st=false;try{st=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches))}catch(e){}
return (st?'home ':'web ')+(/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':'other')}
/* text/plain ולא application/json: בלי בקשת preflight, שהשרת של גוגל לא עונה עליה.
   לכל בקשה יש מגבלת זמן: באייפון אפליקציה שיצאה לרקע באמצע בקשה יכולה
   להשאיר אותה תלויה לנצח, ואז שום סנכרון לא היה יוצא עד סגירה מלאה. */
function srvPost(msg,ms){let ctl=null,tid=0;
try{ctl=(typeof AbortController==='function')?new AbortController():null}catch(e){ctl=null}
try{const p=fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
 body:JSON.stringify(msg),redirect:'follow',credentials:'omit',cache:'no-store',signal:ctl?ctl.signal:undefined})
 .then(r=>r.json());
 if(ctl)tid=setTimeout(()=>{try{ctl.abort()}catch(e){}},ms||25000);
 return p.then(j=>{clearTimeout(tid);return j},e=>{clearTimeout(tid);throw e})}
catch(e){clearTimeout(tid);return Promise.reject(e)}}
/* רק מה שהדוח צריך. לא נשלחים: תמונות, המשפט האישי, מה שנכתב בשאלה
   האישית, מבחנים, רשימת קניות, הערות חופשיות ממשחקים. */
function syncPayload(){const A=a=>Array.isArray(a)?a.slice():[];
const food={};Object.keys(S.food||{}).forEach(k=>{const r=S.food[k];food[k]={m:Object.assign({},r.m),x:r.x.slice(),t:r.t.slice()}});
return{start:S.start,
 sessions:S.sessions.map(x=>({date:x.date,w:x.w,log:x.log})),
 bw:A(S.bw),ht:A(S.ht),footDays:A(S.footDays),shotDays:A(S.shotDays),fuelDays:A(S.fuelDays),
 intentDays:A(S.intentDays),teamDays:A(S.teamDays),
 games:(S.games||[]).map(g=>({d:g.d,opp:g.opp,home:g.home,mb:g.mb,good:g.good,fix:g.fix,saw:g.saw,prev:g.prev,lg:g.lg})),
 sleep:A(S.sleep),food,dayplan:S.dayplan,sched:S.sched,times:S.times,pauses:A(S.pauses),
 focus:S.focus,focusLog:A(S.focusLog),miles:A(S.miles)}}
/* שמות לתצוגה בדוח — השרת לא מכיר את הקבועים של האפליקציה */
function syncMeta(){const ex={},chips={},moments={},miles={};
Object.keys(EX).forEach(id=>ex[id]=EX[id].n);CHIPS.forEach(c=>chips[c[0]]=c[1]);
MOMENTS.forEach(m=>moments[m[0]]=m[1]);MILES.forEach(m=>miles[m[0]]=m[2]);
return{v:APP_V,ex,chips,moments,miles}}
let syncBusy=false,syncBusyAt=0;
function syncNow(force){
if(DEVOFF||!paired())return Promise.resolve(null);
if(syncBusy&&Date.now()-syncBusyAt<9e4)return Promise.resolve(null);
const st=syncSt(),now=nowD().getTime();
if(!force&&st.try&&now-st.try<15*6e4)return Promise.resolve(null);
syncBusy=true;syncBusyAt=Date.now();st.try=now;setSyncSt(st);
let body;try{body={op:'sync',key:st.key,data:syncPayload(),meta:syncMeta()}}
catch(e){syncBusy=false;return Promise.resolve(null)}
return srvPost(body,40000).then(j=>{const s=syncSt();
 if(j&&j.ok){s.at=nowD().getTime();s.err=''}
 else if(j&&j.err==='unpaired'){delete s.key;s.err='unpaired'}
 else s.err=String((j&&j.err)||'bad').slice(0,20);
 setSyncSt(s);syncBusy=false;return j})
.catch(()=>{const s=syncSt();s.err='net';setSyncSt(s);syncBusy=false;return null})}
/* פעם ביום. ובשבת אחרי 16:00 — עותק נוסף, כדי שהיום האחרון בשבוע ייכנס לדוח של 19:00. */
function syncDue(){if(DEVOFF||!paired())return false;
const s=syncSt();if(!s.at)return true;
const now=nowD(),last=new Date(s.at);
if(dkey(last)!==today())return true;
return now.getDay()===6&&now.getHours()>=16&&last.getHours()<16}
function autoSync(){if(syncDue())setTimeout(()=>{syncNow(false)},1500)}
function agoTime(ms){const d=new Date(ms);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function agoText(ms){const d=new Date(ms),k=dkey(d),t=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
return (k===today()?'היום':k===shiftKey(-1)?'אתמול':fmt(k))+' ב-'+t}
function syncCard(){const s=syncSt();
if(DEVOFF)return `<div class="card"><div class="cue">מצב בדיקה פעיל — שום דבר לא נשלח לדוח.</div></div>`;
if(paired()){const late=!s.at||nowD().getTime()-s.at>=48*36e5;
 return `<div class="card"><div class="cue">מחובר לדוח השבועי. ${s.at?'עותק אחרון: '+agoText(s.at)+'.':'עוד לא נשלח עותק.'}</div></div>
${late?`<button class="big" onclick="manualSync()">שלח עכשיו</button>`:''}`}
return `<div class="card"><div class="cue">${s.err==='unpaired'?'החיבור לדוח נותק. אפשר לחבר מחדש.'
 :'הדוח השבועי במייל נשען על עותק של הנתונים. החיבור נעשה פעם אחת, עם קוד שעודד מקבל.'}</div></div>
<button class="ghost" onclick="closeSheet();openPair()">חיבור לדוח</button>`}
function manualSync(){toast('שולח…');
syncNow(true).then(j=>{toast(j&&j.ok?'נשלח':'לא הצליח. ננסה שוב בפתיחה הבאה');
 if(document.getElementById('sh').classList.contains('on'))openSettings()})}
/* קוד שנשלח נזכר לרבע שעה (זמן התוקף שלו): אם הגיליון נסגר בזמן שמחכים
   לקוד, פתיחה מחדש מראה ישר את שדה הקוד ולא מבקשת קוד חדש. */
let pairSt={sent:false,msg:'',busy:false};
function codeFresh(){const a=syncSt().codeAt;return typeof a==='number'&&nowD().getTime()-a<15*6e4?a:0}
function openPair(){pairSt={sent:!!codeFresh(),msg:'',busy:false};drawPair()}
function drawPair(){
openSheet(`<div class="grab"></div><div class="h2">חיבור לדוח</div>
<div class="sub">פעם ביום נשלח עותק של האימונים, האוכל, השינה והמשקל לדוח השבועי במייל. התמונות והמשפט האישי נשארים רק בטלפון.</div>
${pairSt.sent?`<div class="cue" style="margin-top:16px;font-size:14px;color:#DCDCE0">עודד קיבל במייל קוד בן 6 ספרות${codeFresh()?' (נשלח ב-'+agoTime(codeFresh())+')':''}. הקוד תקף לרבע שעה.</div>
<input class="fin" id="pcode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"
style="direction:ltr;text-align:center;font-size:24px;letter-spacing:6px;margin-top:12px">
<button class="big" style="margin-top:12px" onclick="doPair()">חבר</button>
<button class="ghost" onclick="askCode()">שלח קוד חדש</button>`
:`<button class="big" style="margin-top:16px" onclick="askCode()">שלח קוד לעודד</button>`}
<div id="pmsg" class="cue" style="margin-top:12px;min-height:20px;font-size:13.5px;color:#DCDCE0">${esc(pairSt.msg)}</div>
<button class="ghost" onclick="closeSheet()">סגור</button>`)}
function pairMsg(t){pairSt.msg=t;const e=document.getElementById('pmsg');if(e)e.textContent=t}
const NET_MSG='אין חיבור לאינטרנט, או שהשרת לא ענה. לנסות שוב.';
function askCode(){if(DEVOFF){pairMsg('במצב בדיקה אין חיבור לדוח.');return}
if(pairSt.busy)return;pairSt.busy=true;pairMsg('שולח…');
srvPost({op:'code',dev:devLabel()}).then(j=>{pairSt.busy=false;
 if(j&&j.ok){const s=syncSt();s.codeAt=nowD().getTime();setSyncSt(s);
  pairSt.sent=true;pairSt.msg='';drawPair();
  setTimeout(()=>{const e=document.getElementById('pcode');if(e)e.focus()},80);return}
 const e=j&&j.err;
 if(e==='wait'){pairSt.sent=true;pairSt.msg='קוד נשלח ממש עכשיו. כדאי לבדוק במייל של עודד.';drawPair();return}
 pairMsg(e==='closed'?'החיבור סגור כרגע. עודד קיבל מייל עם קישור לפתיחה — אחרי שיפתח, לנסות שוב.'
  :e==='limit'?'היום כבר נשלחו הרבה קודים. אפשר שוב מחר.'
  :'השרת לא הצליח לשלוח קוד. לנסות שוב בעוד דקה.')})
.catch(()=>{pairSt.busy=false;pairMsg(NET_MSG)})}
function doPair(){const e=document.getElementById('pcode');
const code=(e?e.value:'').replace(/\D/g,'');
if(code.length!==6){pairMsg('הקוד הוא 6 ספרות.');return}
if(DEVOFF){pairMsg('במצב בדיקה אין חיבור לדוח.');return}
if(pairSt.busy)return;pairSt.busy=true;pairMsg('מתחבר…');
srvPost({op:'pair',code,dev:devLabel()}).then(j=>{pairSt.busy=false;
 if(j&&j.ok&&typeof j.key==='string'&&j.key.length>=32){
  setSyncSt({key:j.key,dev:devLabel(),since:nowD().getTime(),at:0,err:''});
  closeSheet();draw();toast('מחובר. העותק הראשון נשלח עכשיו');
  syncNow(true).then(r=>{if(!(r&&r.ok))toast('העותק הראשון לא נשלח. ננסה שוב בפתיחה הבאה')});return}
 const er=j&&j.err;
 pairMsg(er==='bad_code'?'הקוד לא נכון.'+(Number.isInteger(j.left)?' נשארו '+j.left+' ניסיונות.':'')
  :er==='expired'?'הקוד פג או נוצל. לבקש קוד חדש.'
  :er==='closed'?'החיבור נסגר. לבקש קוד חדש.'
  :'השרת לא ענה כמו שצריך. לנסות שוב.')})
.catch(()=>{pairSt.busy=false;pairMsg(NET_MSG)})}

const DL=['א','ב','ג','ד','ה','ו','ש'];
function dkey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function sets(){return{foot:new Set(S.footDays||[]),gym:new Set(S.sessions.map(x=>x.date)),shot:new Set(S.shotDays||[]),fuel:new Set(S.fuelDays||[]),team:new Set(S.teamDays||[])}}
function weekDays(back){const t=nowD();t.setHours(0,0,0,0);
const sun=new Date(t);sun.setDate(sun.getDate()-sun.getDay()-7*back);
return Array.from({length:7},(_,i)=>{const d=new Date(sun);d.setDate(d.getDate()+i);
return{d,k:dkey(d),w:i,fut:d>t,today:dkey(d)===dkey(t)}})}

shot:'<ellipse cx="12" cy="7.4" rx="7.8" ry="2.5" fill="currentColor" stroke="none"/><path d="M6.2 9.6 9 18.4c.2.7.8 1.1 1.5 1.1h3c.7 0 1.3-.4 1.5-1.1l2.8-8.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13.9h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'};
function ric(k){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${RIC[k]}</svg>`}
const ROWS=[['רגליים','foot'],['כוח','gym'],['קליעה','shot'],['אוכל','fuel']];
function calHTML(){const S3=sets(),wk=weekDays(0);
let g='<div class="hd"></div>'+wk.map(x=>`<div class="hd ${x.today?'now':''}">${DL[x.w]}</div>`).join('');
for(const [lbl,key] of ROWS){
 g+=`<div class="rl">${ric(key)}</div>`;
 g+=wk.map(x=>{const t=x.today?' now':'';
  if(!isPl(key,x.k,x.w))return `<div class="c off${t}"></div>`;
  if(S3[key].has(x.k))return `<div class="c on${t}"></div>`;
  if(x.fut||x.today)return `<div class="c wait${t}"></div>`;
  return `<div class="c${t}"></div>`}).join('')}

/* שבוע שהסתיים לפני שהתוכנית התחילה הוא לא "0 מתוך 7" — הוא פשוט לא קיים.
   בלי השער הזה המסך הדפיס 16 אפסים ביום הראשון של אורי, בדיוק כמו
   19 "הוחמץ" שכבר תיקנו פעם אחת בלוח עצמו. */
const hist=[1,2,3,4].filter(b=>!S.start||dnum(weekDays(b)[6].k)>=dnum(S.start))
 .map(b=>{const days=weekDays(b);
 const f=ROWS.map(([,key])=>{
  const pl=days.filter(x=>!x.fut&&isPl(key,x.k,x.w)).length;
  const dn=days.filter(x=>!x.fut&&S3[key].has(x.k)).length;
  return{dn,pl}});
 const lbl=b===1?'שבוע שעבר':'לפני '+b+' שבועות';
 return `<div class="hrow"><span class="wl">${lbl}</span><span class="fr">
${f.map(x=>`<b class="n ${x.dn>=x.pl&&x.pl?'full':''}">${x.dn}/${x.pl}</b>`).join('')}</span></div>`}).join('');

return `<div class="wk">${g}</div>
<div class="lgd"><span><i></i>בוצע</span><span><i class="w"></i>לפנינו</span><span><i class="g"></i>הוחמץ</span><span>ריק — לא תוכנן</span></div>
<div class="lgd" style="margin-top:6px">${ROWS.map(([n,k])=>`<span><span style="color:var(--t2);display:flex;width:15px;height:15px">${ric(k)}</span>${n}</span>`).join('')}</div>
${hist?`<div class="hist"><div class="hrow" style="border-bottom:1px solid var(--c3)">
<span class="wl" style="font-weight:700;color:#fff">היסטוריה</span>
<span class="fr" style="font-size:10px;color:var(--t3)">${ROWS.map(([n])=>`<b>${n}</b>`).join('')}</span></div>
${hist}</div>`:''}`}

function bkDays(){if(!S.lastBackup)return null;
return Math.floor((dnum(today())-dnum(S.lastBackup))/864e5)}
function bkNote(){if(!S.sessions.length&&!(S.footDays||[]).length)return '';
const d=bkDays();
if(d===null)return `<div class="warnbox" style="margin-top:11px"><b>עוד לא גיבית</b>
<p>דקה אחת עכשיו שווה כל מה שצברת עד היום.</p></div>`;
if(d>=14)return `<div class="warnbox" style="margin-top:11px"><b>עברו ${d} ימים מהגיבוי האחרון</b>
<p>הזמן לגבות שוב.</p></div>`;
return `<div class="tiny" style="margin-top:9px">גיבוי אחרון: ${d===0?'היום':(d===1?'אתמול':'לפני '+d+' ימים')}</div>`}
function exportData(){S.lastBackup=today();save();
const cp=Object.assign({},S);delete cp.photos;   // תמונות נשארות על המכשיר — הודעת וואטסאפ לא תסחב אותן
const txt=JSON.stringify(cp);
const done=()=>{draw();toast('הועתק — תשלח לעצמך בוואטסאפ')};
try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done))}
catch(e){fallbackCopy(txt,done)}}
function fallbackCopy(txt,done){openSheet(`<div class="grab"></div><div class="h2">הנתונים שלך</div>
<div class="sub">סמן הכל, העתק, ושלח לעצמך</div>
<textarea readonly style="width:100%;height:140px;margin-top:12px;background:var(--c2);
border:1px solid var(--c3);border-radius:11px;color:#fff;font-size:11px;padding:10px">${esc(txt)}</textarea>
<button class="ghost" onclick="closeSheet()">סגור</button>`)}
function openImport(){openSheet(`<div class="grab"></div><div class="h2">שחזור מגיבוי</div>
<div class="sub">הדבק כאן את הטקסט ששמרת. זה יחליף את כל הנתונים הנוכחיים.</div>
<textarea id="imp" style="width:100%;height:140px;margin-top:12px;background:var(--c2);
border:1px solid var(--c3);border-radius:11px;color:#fff;font-size:11px;padding:10px"></textarea>
<button class="big" style="margin-top:12px" onclick="doImport()">שחזר</button>
<button class="ghost" onclick="closeSheet()">ביטול</button>`)}
function doImport(){const prev=JSON.stringify(S);
try{const raw=JSON.parse(document.getElementById('imp').value);
if(!raw||!Array.isArray(raw.sessions))throw 0;
const o=normalize(raw);if(!o)throw 0;
const d=dropped;
S=o;syncSched();save();closeSheet();draw();
toast('שוחזרו '+S.sessions.length+' אימונים · '+(S.sleep||[]).length+' לילות · '+(S.photos||[]).length+' תמונות'+(d?' · '+d+' רשומות פגומות נוקו':''))}
catch(e){S=JSON.parse(prev);toast('הטקסט לא תקין')}}

function addBw(){const last=S.bw.length?S.bw[S.bw.length-1].kg:'';
openSheet(`<div class="grab"></div><div class="h2">משקל גוף</div>
<div class="sub">בוקר, לפני אוכל, פעם בשבוע</div>
<div class="num"><div><label>קילוגרם</label>
<input id="ibw" type="number" inputmode="decimal" step="0.1" value="${last}"></div></div>
<button class="big" onclick="saveBw()">שמור</button>
<button class="ghost" onclick="closeSheet()">ביטול</button>`);
setTimeout(()=>{const e=document.getElementById('ibw');if(e)e.select()},60)}
function saveBw(){const n=parseFloat(document.getElementById('ibw').value);
if(!numOk(n,30,150)){toast('משקל לא הגיוני — בין 30 ל-150 ק״ג');return}
const i=S.bw.findIndex(x=>x.d===today());
if(i>-1)S.bw[i].kg=n;else S.bw.push({d:today(),kg:n});
save();closeSheet();draw();toast((i>-1?'עודכן ':'נרשם ')+n+' ק״ג');popMile()}
function wipe(){openSheet(`<div class="grab"></div><div class="h2">למחוק את כל הנתונים?</div>
<div class="sub">כל האימונים, המשקלים והמבחנים. אין דרך חזרה.</div><div style="height:16px"></div>
<button class="big" onclick="doWipe()">כן, מחק הכל</button>
<button class="ghost" onclick="closeSheet()">ביטול</button>`)}
function doWipe(){localStorage.removeItem(K);S=load();syncSched();closeSheet();draw();toast('הכל נמחק')}
function delLast(){if(!S.sessions.length){toast('אין אימונים');return}
const l=S.sessions[S.sessions.length-1];
openSheet(`<div class="grab"></div><div class="h2">למחוק את האימון האחרון?</div>
<div class="sub">אימון ${l.w} מ-${fmt(l.date)} · ${Object.values(l.log).flat().length} סטים</div>
<div style="height:16px"></div>
<button class="big" onclick="doDelLast()">כן, מחק</button>
<button class="ghost" onclick="closeSheet()">ביטול</button>`)}
function doDelLast(){S.sessions.pop();save();closeSheet();draw();toast('האימון נמחק')}

/* ---------- toast + audio ---------- */
let TT=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
if(TT)clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('on'),2400)}
let AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
if(AC.state==='suspended'){const r=AC.resume();if(r&&r.catch)r.catch(()=>{})}}catch(e){}}
function tone(f,t0,dur,vol){const o=AC.createOscillator(),g=AC.createGain();
o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.015);
g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.start(t0);o.stop(t0+dur+0.02)}
function stepTone(n){try{unlockAudio();if(!AC)return;
tone(480+n*72,AC.currentTime,0.16,0.3)}catch(e){}}
function winTone(){try{unlockAudio();if(!AC)return;const t0=AC.currentTime;
[[523,0],[659,0.11],[784,0.22],[1046,0.33]].forEach(([f,o])=>tone(f,t0+o,0.3,0.32))}catch(e){}}
function tick(n){try{unlockAudio();if(!AC)return;
tone(n<=3?760:520,AC.currentTime,0.07,0.22)}catch(e){}}
function goTone(){try{unlockAudio();if(!AC)return;const t0=AC.currentTime;
tone(1046,t0,0.22,0.34)}catch(e){}}
/* unlockAudio חייב לרוץ גם כאן. ההקשר נכנס ל-suspended כשהמסך ננעל באמצע
   מנוחה, ובלי resume הצליל שאמור להחזיר אותו לסט פשוט לא מתנגן. */
function beep(){try{unlockAudio();if(!AC)return;const t0=AC.currentTime;
[0,0.28,0.56].forEach((off,k)=>{const o=AC.createOscillator(),g=AC.createGain();
o.type='sine';o.frequency.value=k===2?1180:880;o.connect(g);g.connect(AC.destination);
g.gain.setValueAtTime(0.0001,t0+off);
g.gain.exponentialRampToValueAtTime(0.35,t0+off+0.02);
g.gain.exponentialRampToValueAtTime(0.0001,t0+off+0.22);
o.start(t0+off);o.stop(t0+off+0.25)})}catch(e){}}
try{const mf={name:"HARD WORK",short_name:"HARD WORK",description:"Earn your dream",display:"standalone",orientation:"portrait",
background_color:"#08080A",theme_color:"#08080A",start_url:".",scope:".",
icons:[{src:document.querySelector('link[rel="apple-touch-icon"]').href,sizes:"180x180",type:"image/png",purpose:"any"}]};
const lk=document.createElement('link');lk.rel='manifest';
lk.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
document.head.appendChild(lk)}catch(e){}

if('serviceWorker' in navigator){window.addEventListener('load',function(){
try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}})}

/* ---------- sheet + timer ---------- */
function openSheet(h){document.getElementById('shc').innerHTML=h;document.getElementById('sh').classList.add('on')}
function closeSheet(){document.getElementById('sh').classList.remove('on')}
let tEnd=0, tLead=0, tLbl='מנוחה', lastN=-1, WL=null;
async function lockScreen(){try{if('wakeLock' in navigator)WL=await navigator.wakeLock.request('screen')}catch(e){}}
function unlockScreen(){try{if(WL){const r=WL.release();if(r&&r.catch)r.catch(()=>{});WL=null}}catch(e){}}
function paintT(){const el=document.getElementById('tm'),now=Date.now();
if(tLead){const n=Math.ceil((tLead-now)/1000);
 if(n>0){if(n!==lastN){lastN=n;tick(n)}
  el.textContent='תתכונן · '+n;el.classList.add('prep');return}
 tLead=0;lastN=-1;el.classList.remove('prep');goTone()}
const n=Math.round((tEnd-now)/1000);
if(n<=0){stopT();beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);
 toast(tLbl==='מנוחה'?'סיימת מנוחה':'סיימת · '+tLbl);return}
el.textContent=tLbl+' · '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0')+'  ·  לחץ לעצור'}
function startT(sec,label,lead){stopT();unlockAudio();lockScreen();
tLbl=label||'מנוחה';lastN=-1;
const now=Date.now();
tLead=lead?now+lead*1000:0;
tEnd=(tLead||now)+sec*1000;
document.getElementById('tm').classList.add('on');
paintT();tint=setInterval(paintT,200)}
function stopT(){if(tint)clearInterval(tint);tint=null;tEnd=0;tLead=0;lastN=-1;
unlockScreen();const el=document.getElementById('tm');
el.classList.remove('on');el.classList.remove('prep')}
/* חזרה לאפליקציה אחרי חמש דקות ומעלה היא "פתיחה": המסך נבנה מחדש (אולי כבר
   יום אחר), תזכורות שנדחו ב"אחר כך" חוזרות, ונבדק אם הגיע זמן העותק היומי. */
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
if(document.visibilityState!=='visible'){hiddenAt=Date.now();return}
if(tEnd){if(Date.now()>=tEnd){stopT();toast('המנוחה נגמרה')}else{lockScreen();paintT()}}
if(hiddenAt&&Date.now()-hiddenAt>=5*6e4){weighLater=false;missLater=false;teamAskHidden='';
 try{draw()}catch(e){}}
hiddenAt=0;autoSync()});

/* ── אתחול: הכל מוצהר, עכשיו מריצים ── */
S=load();
syncSched();
rollWeeks();
try{const l=document.querySelector('link[rel="apple-touch-icon"]');
 if(l)document.documentElement.style.setProperty('--logo','url("'+l.href+'")')}catch(e){}
draw();
autoSync();
</script>
