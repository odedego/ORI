<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HARD WORK">
<title>HARD WORK</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Rubik:wght@400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&text=%D7%90%D7%91%D7%92%D7%93%D7%94%D7%95%D7%96%D7%97%D7%98%D7%99%D7%9A%D7%9B%D7%9C%D7%9D%D7%9E%D7%9F%D7%A0%D7%A1%D7%A2%D7%A3%D7%A4%D7%A5%D7%A6%D7%A7%D7%A8%D7%A9%D7%AA%D7%B3%D7%B4%D6%BE&display=swap" rel="stylesheet">
<style>
/* ═══════════ HARD WORK · שפת עיצוב ═══════════
   שלוש שכבות צבע (נעולות): שחור = רקע · אדום = פעולה · זהב = הישג.
   שלושה פונטים, לכל אחד תפקיד אחד:
   Karantina — כותרות עבריות גדולות בלבד (22px ומעלה; בגודל קטן היא נדחסת מדי).
   Rubik — כל הטקסט הרץ.
   Barlow Condensed — מספרים ומילים לועזיות (מותג, A/B). נטוי רק במספרי "רגע" גדולים.
   אין ריווח אותיות בעברית, אין נטוי בעברית.
   שני סוגי כפתורים, ולא יותר: גלולה = פעולה (.big .ghost .act .note .chp …),
   אריח = נתון או בחירה (סט, שעות שינה, לשונית בלוק). כך רואים מה לוחצים ומה קוראים. */
:root{--red:#E10600;--bg:#08080A;--c1:#151517;--c2:#1E1E21;--c3:#2A2A2E;
--tx:#FFFFFF;--t2:#A1A1A6;--t3:#8A8A92;--miss:#7A1E1B;--red2:#FF4B45;
--ok:#E8C24A;--gd:#C9A227;--gl:#F7DC8A;--on:#0A0A0A;
--gsolid:linear-gradient(135deg,var(--gl) 0%,var(--ok) 45%,var(--gd) 100%);
/* אדום של כפתור: מתחיל באדום של המותג ומעמיק כלפי מטה. הנקודה הבהירה ביותר היא
   #E10600 — לבן עליה 4.63:1. עצירה בהירה יותר (#F0160E) ירדה ל-4.35:1 ונפסלה. */
--redg:linear-gradient(180deg,#E10600 0%,#D40500 55%,#C20500 100%);
--card:linear-gradient(180deg,#19191C 0%,#141416 100%);
--ctl:#1B1B1E;--ln:rgba(255,255,255,.07);--hi:inset 0 1px 0 rgba(255,255,255,.055);
--f-b:'Rubik',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
/* Karantina נטען רק עם אותיות עבריות. ספרות, לטינית וסימנים בכותרת נופלים ל-Barlow Condensed */
--f-d:'Karantina','Barlow Condensed','Rubik',-apple-system,sans-serif;
--f-n:'Barlow Condensed','Rubik',-apple-system,sans-serif;
--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--sheet:cubic-bezier(.22,1.1,.36,1);
--nav:calc(62px + env(safe-area-inset-bottom));}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{color:var(--tx);font-family:var(--f-b);
font-size:16px;line-height:1.5;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body{padding-bottom:var(--nav);background:transparent}
/* תאורת זירה: הילה אדומה חלשה מלמעלה. שכבה קבועה, לא נגללת, לא נלחצת. */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(110% 42% at 88% -6%,rgba(225,6,0,.15),transparent 72%),
radial-gradient(70% 30% at 0% 0%,rgba(255,255,255,.035),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
transition:transform .14s var(--ease),background-color .18s,border-color .18s,color .18s,opacity .18s}
button:active:not([disabled]){transform:scale(.96)}
input{font:inherit}
.ltr{direction:ltr;unicode-bidi:bidi-override;display:inline-block}
.num-f{font-family:var(--f-n)}

/* ── רגעי הישג: הבזק אחד, ואז זהב סטטי ── */
/* left:0 מפורש: ב-RTL אלמנט אבסולוטי בלי left נצמד לימין, והפס נשאר תקוע בקצה. */
@keyframes sweep{0%{transform:translateX(-150%)}100%{transform:translateX(280%)}}
.spark{position:relative;overflow:hidden;isolation:isolate}
.spark::after{content:'';position:absolute;left:0;top:-40%;bottom:-40%;width:60%;pointer-events:none;
background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);
animation:sweep .95s cubic-bezier(.3,0,.2,1) .15s 1 both}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes stamp{0%{transform:scale(1.35);opacity:.2}55%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes medal{0%{transform:scale(.3);opacity:0}62%{transform:scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes halo{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes slam{0%{transform:scale(1.45);opacity:0}60%{transform:scale(.97);opacity:1}100%{transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes tick{0%{transform:scale(1.5);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
.fx-pop{animation:pop .44s var(--spring) both}
.fx-stamp{animation:stamp .4s var(--ease) both}
.fx-l{animation:slideL .32s var(--ease) both}
.fx-r{animation:slideR .32s var(--ease) both}
.fx-seg{animation:rise .3s var(--ease) both}
#app.enter .wrap>*{animation:rise .34s var(--ease) both}
.wrap{overflow-x:clip}
#app.enter .wrap>*:nth-child(2){animation-delay:.03s}#app.enter .wrap>*:nth-child(3){animation-delay:.06s}
#app.enter .wrap>*:nth-child(4){animation-delay:.09s}#app.enter .wrap>*:nth-child(5){animation-delay:.12s}
#app.enter .wrap>*:nth-child(n+6){animation-delay:.15s}
/* חלקיקי זהב — נבנים ב-JS בנקודת ההישג ונמחקים אחרי פחות משנייה */
.burst{position:fixed;width:0;height:0;z-index:120;pointer-events:none}
.burst i{position:absolute;left:-2px;top:-7px;width:4px;height:14px;border-radius:2px;background:var(--gsolid)}
.burst i.w{background:#fff}
.hap{position:fixed;right:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;
transition-duration:.01ms!important;transition-delay:0s!important}
.spark::after,.medal .gl::after,.burst,.rdl{display:none}}

/* ── מבנה וטיפוגרפיה ── */
.wrap{padding:max(calc(env(safe-area-inset-top) + 18px),56px) 16px 28px;max-width:560px;margin:0 auto}
.h1{font-family:var(--f-d);font-size:50px;font-weight:700;line-height:.92;letter-spacing:0}
.h2{font-family:var(--f-d);font-size:31px;font-weight:700;line-height:1;margin-bottom:6px}
.sub{font-size:13.5px;color:var(--t2);line-height:1.45}
.tiny{font-size:11.5px;color:var(--t3)}
/* הקו מתחת לכותרת: חיתוך אלכסוני — תנועה, לא קו של טופס */
.bar{height:5px;width:42px;background:var(--red);margin:12px 0 20px;border-radius:1px;transform:skewX(-28deg);transform-origin:right}
/* אזור (בלשונית ההתקדמות): הכותרת הגדולה ביותר אחרי כותרת המסך, עם קו שנמתח עד הקצה */
.zone{font-family:var(--f-d);font-size:44px;font-weight:700;line-height:1;margin:40px 0 16px;display:flex;align-items:center;gap:14px}
.zone::after{content:'';flex:1 1 auto;height:1px;background:linear-gradient(270deg,rgba(255,255,255,.16),transparent)}
.zone:first-of-type{margin-top:24px}
.gear{flex:0 0 44px;width:44px;height:44px;padding:10px;color:var(--t2);border-radius:12px;background:var(--ctl);border:1px solid var(--ln)}
.gear svg{width:100%;height:100%}
/* תוויות קטנות: בלי ריווח אותיות. סימן אלכסוני אדום בתחילת השורה */
.sec,.tdh,.ngame .ngh,.slp .slh,.intent .ih,.foc .fh,.anch .anh,.pse .psh,.blk h4,.dtitle{
font-family:var(--f-b);letter-spacing:0;font-weight:700;padding-right:15px;position:relative}
/* הסימן האלכסוני הוא אלמנט נפרד ולא רקע: טקסט לא יושב עליו, ובכותרת flex הוא לא תופס מקום. */
.sec::before,.tdh::before,.ngame .ngh::before,.slp .slh::before,.intent .ih::before,.foc .fh::before,.anch .anh::before,.pse .psh::before,.blk h4::before,.dtitle::before,.fsec>span:first-child::before{
content:'';position:absolute;right:1px;top:50%;width:5px;height:12px;margin-top:-6px;background:var(--red);transform:skewX(-20deg);border-radius:1px}
/* כותרת מקטע: Karantina לבנה. התווית הקטנה והאפורה של פעם הייתה הסימן הכי "טופס" במסך */
.sec,.tdh{font-family:var(--f-d);font-size:29px;font-weight:700;line-height:1;color:#fff;margin:36px 0 13px;padding-right:17px}
.sec::before,.tdh::before{width:6px;height:19px;margin-top:-11px}
/* פעולה של מקטע יושבת בשורת הכותרת, לא ככפתור אפור ברוחב מלא מתחתיה */
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:36px 0 13px}
.sech .sec{margin:0}
.sact{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px 0 2px;
font-family:var(--f-b);font-size:13.5px;font-weight:700;color:var(--red2);min-width:44px;justify-content:center}
.sec .badge,.sec .tiny,.sec>span:not(:first-child){font-family:var(--f-b)}
.sec .badge{font-size:11px}
.sact svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.fsec{padding-right:0}.fsec::before{display:none}
.fsec>span:first-child{padding-right:15px;position:relative}

/* ── משטחים ── */
.card{background:var(--card);border:1px solid rgba(255,255,255,.045);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--hi)}
.card.flat{background:none;border:1px solid var(--c3);box-shadow:none}
/* מצב ריק: מסגרת מקווקוות ושקופה — "כאן יופיע", לא עוד קופסה אפורה */
.card.empty{background:none;box-shadow:none;border:1px dashed rgba(255,255,255,.16);padding:14px 16px}
.card.empty .cue{font-size:13.5px;color:var(--t2);margin:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row[onclick]{min-height:44px;align-items:center}
.nm{font-size:16px;font-weight:600;line-height:1.25}
.sr{font-family:var(--f-n);font-size:19px;font-weight:700;color:#fff;direction:ltr;unicode-bidi:bidi-override;white-space:nowrap}
.cue{font-size:12.5px;color:var(--t3);margin-top:3px;line-height:1.45}
.last{font-size:12.5px;color:var(--t2);margin-top:6px}

.sets{display:flex;gap:7px;margin-top:14px}
.set{flex:1;background:var(--c2);border:1px solid var(--ln);border-radius:12px;padding:0 2px;text-align:center;min-height:56px;
font-size:13px;font-weight:600;color:var(--t3)}
.set.on{background:linear-gradient(180deg,rgba(232,194,74,.14),rgba(232,194,74,.05));border-color:rgba(232,194,74,.45);color:var(--ok);font-family:var(--f-n);font-size:20px;font-weight:700}
/* הסט הבא הוא הפעולה — רק הוא אדום */
.set.nx{background:var(--redg);border-color:rgba(255,120,110,.35);color:#fff;font-weight:700;
box-shadow:0 8px 18px -10px rgba(225,6,0,.9),inset 0 1px 0 rgba(255,255,255,.18)}
.acts{display:flex;gap:7px;margin-top:9px}
.act{flex:1;background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:12px 4px;text-align:center;min-height:46px;
font-size:13.5px;font-weight:600;color:#E4E4E8}
.act.solid{background:var(--redg);color:#fff;border-color:rgba(255,120,110,.3);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}

.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15px;min-height:50px}
.chk:last-child{border-bottom:none}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #6A6A72;flex:0 0 26px;
display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--on);transition:border-color .2s}
.cks{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chk.on .box,.srow.on .sbox{background:var(--gsolid);border-color:var(--gd);color:var(--on)}
/* שורה שנסגרה: שקטה ומקופלת — בלי קו חוצה (סימן של רשימת מטלות, לא של אימון) */
.chk.on .ct{color:var(--t3)}
.chk.on .ct .cue{display:none}
.chk.on .cq{color:var(--t3)}
.chk.on .cq i{display:none}
.chk.on .vi{display:none}
.chk.on .qw{gap:0}
.ckw:has(.chk.on) .ckact{display:none}
/* התרגיל הבא: כותרת חזקה, כפתור טכניקה אדום, פס אדום בקצה */
.ckw.nx{position:relative}
.ckw.nx::before{content:'';position:absolute;right:-10px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--red)}
.chk.nx .ct{font-weight:700;font-size:16.5px}
.chk.nx .ct .cue{font-weight:400;font-size:12.5px}
.chk.nx .vi{background:var(--redg);border-color:transparent;box-shadow:0 8px 16px -8px rgba(225,6,0,.9)}
/* וי שזה עתה סומן: הקופסה קופצת והסימן נמתח */
.chk.fx .box,.srow.fx .sbox{animation:pop .44s var(--spring) both}
.chk.fx .cks path,.srow.fx .cks path,.mdone.fx .cks path{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .3s .12s var(--ease) forwards}
.ct{flex:1;line-height:1.3}
.qw{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:7px}
.cq{font-family:var(--f-n);font-size:20px;color:#fff;font-weight:700;text-align:center;line-height:1.05}
.cq i{display:block;font-family:var(--f-b);font-style:normal;font-size:11px;font-weight:500;color:var(--t2);margin-top:2px}
.vi{width:38px;height:38px;border-radius:50%;background:#2A2A2E;border:1px solid rgba(255,255,255,.08);color:#fff;flex:0 0 38px;
display:flex;align-items:center;justify-content:center;position:relative}
.vi svg{width:12px;height:12px;fill:currentColor;margin-left:-2px}
/* אייקון בתוך טקסט: SVG ולא תו. ▶ ו-⏱ מוצגים באייפון כאימוג׳י צבעוני. */
.ic{display:inline-block;width:12px;height:12px;fill:currentColor;vertical-align:-1px;margin-left:6px}
.tmr .ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;vertical-align:-3px;margin-left:2px}
.vi::after{content:'';position:absolute;inset:-4px;border-radius:50%}
.chk.on .vi{background:var(--c3);box-shadow:none}

/* ── ניווט תחתון: מחוון שגולש בין הלשוניות ── */
.nav{position:fixed;bottom:0;right:0;left:0;background:rgba(12,12,14,.84);
backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-top:1px solid var(--ln);
display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
.nb{flex:1;padding:10px 0 8px;text-align:center;font-size:11px;color:var(--t3);font-weight:500;min-height:58px;position:relative}
.nb:active:not([disabled]){transform:scale(.92)}
.nb.on{color:#fff}
.nb.on .ni{color:var(--red2)}
.ni{display:block;width:24px;height:24px;margin:0 auto 4px;transition:transform .3s var(--spring),color .2s}
.nb.on .ni{transform:translateY(-1px) scale(1.06)}
.nind{position:absolute;top:-1px;right:0;width:25%;height:3px;pointer-events:none;
transform:translateX(calc(var(--ti,0) * -100%));transition:transform .42s var(--spring)}
.nind::before{content:'';position:absolute;top:0;right:50%;width:30px;margin-right:-15px;height:3px;border-radius:0 0 3px 3px;
background:var(--red);box-shadow:0 0 14px rgba(225,6,0,.75)}

/* ── גיליון תחתון: עולה עם קפיץ, הרקע מתעמעם ── */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:90;display:flex;
align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;
transition:opacity .24s var(--ease),visibility 0s linear .3s}
.sheet.on{visibility:visible;opacity:1;transition:opacity .2s var(--ease),visibility 0s}
.sc{background:linear-gradient(180deg,#18181B,#111113 30%);width:100%;max-width:560px;border-radius:24px 24px 0 0;
padding:12px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
border-top:1px solid rgba(255,255,255,.08);transform:translateY(105%);transition:transform .3s var(--ease)}
.sheet.on .sc{transform:none;transition:transform .46s var(--sheet)}
.grab{width:40px;height:5px;background:#3A3A40;border-radius:3px;margin:0 auto 18px}
.blk{margin-bottom:20px}
.blk h4{font-size:14px;color:#D4D4D8;margin-bottom:8px}
.blk p,.blk li{font-size:14.5px;color:#D8D8DC;line-height:1.65}
.blk ol{padding-right:18px}
.blk li{margin-bottom:6px}
.feel{background:linear-gradient(135deg,rgba(225,6,0,.13),rgba(225,6,0,.04));border:1px solid rgba(255,75,69,.18);border-radius:14px;padding:14px;white-space:pre-line}

.num{display:flex;gap:10px;margin:18px 0}
.num>div{flex:1}
.num label{display:block;font-size:12.5px;color:var(--t2);margin-bottom:6px}
.num input{width:100%;background:var(--c2);border:1px solid var(--c3);border-radius:14px;
padding:10px 14px;color:#fff;font-family:var(--f-n);font-size:34px;font-weight:700;text-align:center;direction:ltr;line-height:1.2;
transition:border-color .2s,box-shadow .2s}
.num input:focus{outline:none;border-color:var(--red2);box-shadow:0 0 0 3px rgba(225,6,0,.22)}
.big{width:100%;background:var(--redg);color:#fff;border-radius:999px;padding:15px;min-height:56px;
font-size:17px;font-weight:700;text-align:center;
box-shadow:0 14px 28px -14px rgba(225,6,0,.95),inset 0 1px 0 rgba(255,255,255,.2)}
.big:active:not([disabled]){transform:scale(.98)}
.ghost+.card{margin-top:10px}
/* פעולה משנית בגיליון: גלולה שקופה עם קו. בתוך מסך: גלולה קומפקטית בגודל התוכן, לא פס אפור ברוחב מלא */
.ghost{width:100%;background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:13px;min-height:50px;
font-size:15px;font-weight:600;color:#E4E4E8;text-align:center;margin-top:10px}
.wrap .ghost{width:fit-content;max-width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin:12px 0 0;padding:0 20px;min-height:46px;font-size:14px}


/* ── טיימר ──
   מנוחה: פס עליון חי — ספרות גדולות ופס שמתרוקן.
   תרגיל מדוד (עם הכנה): מסך מלא, קריא משני מטרים — הטלפון מונח על הרצפה. */
.timer{position:fixed;top:0;right:0;left:0;color:#fff;z-index:70;display:none;cursor:pointer}
.timer.on{display:block}
.timer.rest{background:rgba(14,14,16,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.08);padding:max(calc(env(safe-area-inset-top) + 6px),44px) 16px 10px;
animation:rise .3s var(--ease) both}
.tmrow2{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto}
.tml{font-size:14px;font-weight:700;color:var(--t2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmn{font-family:var(--f-n);font-weight:800;font-style:italic;font-size:38px;line-height:1;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.tmx{font-size:13px;font-weight:600;color:#D8D8DC;border:1px solid rgba(255,255,255,.16);background:transparent;border-radius:999px;padding:0 16px;min-height:44px;display:flex;align-items:center;white-space:nowrap}
.tmtrack{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin:9px auto 0;max-width:560px;overflow:hidden}
.tmtrack i{display:block;height:100%;width:100%;background:var(--red);border-radius:2px;transform-origin:right;transition:transform .2s linear}
.timer.hot .tmn{color:var(--red2)}
/* חמש השניות האחרונות: דפיקה אחת בכל שנייה, לא פעימה בלי סוף */
.tmn.tk{animation:tock .42s var(--ease) both}
@keyframes tock{0%{transform:scale(1.3)}100%{transform:none}}
/* סוף מנוחה: הפס מבזיק לבן ונאסף למעלה */
.timer.rest.bye{animation:barOut .4s .06s cubic-bezier(.5,0,.75,0) both}
.timer.rest.bye .tmtrack{background:rgba(255,255,255,.75);transition:background .1s}
@keyframes barOut{to{transform:translateY(-105%);opacity:0}}
/* סוף תרגיל מדוד: הטבעת מתמלאת בזהב, וי נמתח, ואז המסך נעלם */
.timer.full.bye .tp{stroke:var(--ok);transition:stroke-dashoffset .4s var(--ease),stroke .2s}
.timer.full.bye .tfn{color:var(--ok)}
.timer.full.bye .tfn .cks{width:44%;height:44%;stroke-width:2.6}
.timer.full.bye .tfn .cks path{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .4s .1s var(--ease) forwards}
.timer.full.bye .tfk{color:var(--ok);font-weight:700}

@keyframes fadeOut{to{opacity:0}}
.timer.full{inset:0;bottom:0;background:radial-gradient(90% 60% at 50% 40%,#1A0B0B,#08080A 70%);
display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.timer.full.on{display:flex;animation:rise .25s var(--ease) both}
.timer.full.on.bye{animation:fadeOut .28s .85s ease both}
.timer.full.bye .tfstop{visibility:hidden}
.tfl{font-family:var(--f-d);font-size:34px;font-weight:700;line-height:1;color:#fff;max-width:92%}
.tfk{font-size:14px;font-weight:600;color:var(--t2);margin-top:8px}
.tfr{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:28px 0 22px}
.tfr>svg{width:100%;height:100%;transform:rotate(-90deg)}
.tfr circle{fill:none;stroke-width:7}
.tfr .tr{stroke:rgba(255,255,255,.08)}
.tfr .tp{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.timer.prep .tfr .tp{stroke:#5A5A60}
.tfn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font-family:var(--f-n);font-weight:800;font-style:italic;font-size:min(36vw,150px);line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.tfn.tk{animation:tick .45s var(--ease) both}
.timer.prep .tfn{color:var(--t2)}
.timer.full.hot .tfn{color:var(--red2)}
.tfstop{min-width:150px;min-height:54px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;font-size:16px;font-weight:700}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--ln);vertical-align:top}
.tbl td:first-child{color:var(--red2);font-weight:700;white-space:nowrap;width:64px}
.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-block;background:var(--c2);border-radius:8px;padding:3px 9px;
font-size:11.5px;color:var(--t2);margin:0 0 0 5px}
/* ── כרטיס הפתיחה במסך הבית ── */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:20px 20px 18px;margin-bottom:14px;
background:radial-gradient(120% 80% at 100% 0%,rgba(225,6,0,.2),transparent 55%),linear-gradient(180deg,#1A1A1D,#101012);
border:1px solid rgba(255,255,255,.06);box-shadow:var(--hi),0 20px 40px -24px rgba(0,0,0,.8)}
/* קווי מגרש: קשת שלוש הנקודות, כמעט שקופה */
.hero::before{content:'';position:absolute;z-index:-1;left:-150px;top:-170px;width:340px;height:340px;border-radius:50%;
border:2px solid rgba(255,255,255,.028)}
.hero .h1{font-size:58px;margin-top:10px}
.wtag{background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:700;padding:5px 14px 5px 15px;white-space:nowrap;
clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);display:inline-block;line-height:18px}
.wtag .ltr{font-family:var(--f-n);font-size:15px;line-height:1}
.stat{display:flex;gap:8px;margin-top:16px}
.stat{gap:0}
.stat>div{flex:1;padding:6px 4px 4px;text-align:center;min-width:0}
.stat>div+div{border-right:1px solid var(--ln)}
.hero .stat{gap:0;margin-top:18px;padding-top:14px;border-top:1px solid var(--ln)}
.hero .stat>div{padding:2px 4px}
.hero .stat .v{font-size:36px}
.stat .v{font-family:var(--f-n);font-size:42px;font-weight:700;color:#fff;line-height:1}
.stat .k{font-size:11.5px;color:var(--t3);margin-top:5px}
.gap{height:8px}
/* רשימה יושבת על הרקע עם קווים מפרידים — לא עוד קופסה. הקופסאות נשמרות לדברים שעושים */
.list{border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.bwrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln);font-size:14px}
.bwrow:last-child{border-bottom:none}
.q{font-size:14px;color:#D8D8DC;line-height:1.6;padding:12px 0;border-bottom:1px solid var(--ln)}
.q:last-child{border-bottom:none}
.warnbox{background:linear-gradient(135deg,rgba(225,6,0,.14),rgba(225,6,0,.03) 70%);border:1px solid rgba(255,75,69,.32);border-radius:15px;padding:14px;margin-top:12px}
.warnbox b{color:var(--red2);font-weight:700}
.warnbox p{font-size:13.5px;color:#D8D8DC;line-height:1.55;margin-top:3px}
.two2{display:flex;gap:9px;margin-top:20px}
.mini{flex:1;background:transparent;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:14px 8px;min-height:50px;font-size:13.5px;font-weight:500;color:#C8C8CE}
.wk{display:grid;grid-template-columns:24px repeat(7,1fr);gap:5px;direction:rtl;align-items:center}
.wk .hd{font-size:11.5px;color:var(--t3);text-align:center;font-weight:500;padding-bottom:3px}
.wk .hd.now{color:var(--red2);font-weight:700}
.wk .rl{display:flex;align-items:center;justify-content:center;color:var(--t2)}
.wk .rl svg{width:16px;height:16px}
.wk .c{height:20px;border-radius:6px;background:var(--miss)}
.wk .c.wait{background:#35353B}
.wk .c.on{background:var(--gsolid)}
.wk .c.off{background:none;border:1px solid #232326}
.wk .c.now{outline:1.5px solid var(--red);outline-offset:1.5px}
.fnum{font-family:var(--f-n);font-size:52px;font-weight:800;font-style:italic;color:#fff;line-height:.95}
.fnum.met{color:var(--ok)}
.fnum .fof{font-family:var(--f-b);font-style:normal;font-size:14px;font-weight:600;color:var(--t3)}
.fbar{display:flex;gap:5px;margin-top:14px}
.fbar span{flex:1;height:10px;border-radius:4px;background:var(--c3);transition:background .2s}
.fbar span.on{background:var(--gsolid)}
.badge{display:inline-block;background:var(--gsolid);color:var(--on);font-size:11px;font-weight:700;
padding:4px 11px;letter-spacing:0;white-space:nowrap;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
/* ── טבעת היום ── */
.ringwrap{position:relative;flex:0 0 116px;width:116px;height:116px;border-radius:50%}
.ringsvg{width:116px;height:116px;display:block;filter:drop-shadow(0 0 10px rgba(232,194,74,.18))}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:2px}
.rnum{font-family:var(--f-n);font-size:40px;font-weight:800;font-style:italic;line-height:.9;color:var(--ok);direction:ltr}
.rnum.zero{color:var(--t3)}
.rnum .rp{font-size:18px;font-weight:700}
.rdone{width:34px;height:34px;color:var(--ok);line-height:1}
.rdone svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rdone .dr{stroke-dasharray:21;stroke-dashoffset:21;animation:draw .4s .6s var(--ease) forwards}
.rlbl{font-size:11.5px;color:var(--t3);font-weight:500}
.rdone+.rlbl{color:var(--ok);font-weight:700;font-size:12.5px}
.today{display:flex;gap:16px;align-items:center;margin-top:16px}
.today .tx{flex:1;min-width:0}
.dayn{font-family:var(--f-d);font-size:30px;font-weight:700;line-height:1}
.mot{border-right:3px solid var(--red);padding:2px 13px 2px 0;margin:20px 0 4px;
font-size:15px;line-height:1.55;color:#DCDCE0}
.tdl{margin-top:12px}
.tdh{margin:28px 0 12px}
/* ── רשימת "היום" ── */
.tdi{position:relative;overflow:hidden;display:flex;width:100%;align-items:center;gap:13px;background:var(--card);
border:1px solid rgba(255,255,255,.05);border-radius:18px;padding:13px 14px 15px;margin-bottom:8px;
text-align:right;min-height:72px;box-shadow:var(--hi)}
.tdi:active:not([disabled]){transform:scale(.985);background:var(--c2)}
.tdi .tdc{flex:0 0 44px;height:44px;color:var(--red2);display:flex;align-items:center;justify-content:center;
border:1.5px solid rgba(255,75,69,.42);border-radius:50%}
.tdi .tdc svg{width:21px;height:21px}
/* הבא בתור: פס אדום בקצה, אייקון מלא — זו הפעולה של עכשיו. השאר מחכים בשקט */
.tdi.nx{border-color:rgba(255,75,69,.4);background:linear-gradient(270deg,rgba(225,6,0,.17),rgba(225,6,0,0) 62%),var(--card)}
.tdi.nx::before{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--red)}
.tdi.nx .tdc{background:var(--redg);border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px rgba(225,6,0,.9)}
/* פס התקדמות בתחתית השורה: כמה מהבלוק כבר נסגר */
.tdp{position:absolute;right:14px;left:14px;bottom:7px;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.tdp i{display:block;height:100%;border-radius:2px;background:var(--gsolid)}
.tdi .tdt{flex:1;min-width:0}
.tdi .tdt b{display:block;font-size:16.5px;font-weight:700;line-height:1.25}
.tdi .tdt i{display:block;font-style:normal;font-size:12.5px;color:var(--t2);margin-top:3px}
.tdi .tdm{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--t2);text-align:center;line-height:1;min-width:44px}
.tdi .tdm .ltr{display:block;font-family:var(--f-n);font-size:30px;font-weight:800;font-style:italic;color:#fff;margin-bottom:1px;padding:0 .06em}
.tdd{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tdd span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ok);background:rgba(232,194,74,.1);
border:1px solid rgba(232,194,74,.36);border-radius:999px;padding:8px 14px 8px 12px}
.tdd .cks{width:14px;height:14px;flex:0 0 14px}
.allin{background:linear-gradient(135deg,rgba(232,194,74,.16),rgba(232,194,74,.04));border:1px solid rgba(232,194,74,.4);border-radius:15px;
padding:14px;text-align:center;font-size:15px;font-weight:700;color:var(--ok)}
/* ── אימון כוח: תרגיל אחד על המסך ── */
.fxhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
color:var(--t2);margin:16px 0 6px}
.fxbar{height:6px;background:var(--c2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.fxbar i{display:block;height:100%;background:var(--gsolid);border-radius:3px;transition:width .5s var(--ease)}
.fxcard{background:var(--card);border:1px solid rgba(255,255,255,.055);border-radius:22px;padding:20px 17px 17px;box-shadow:var(--hi)}
.fxname{font-family:var(--f-d);font-size:40px;font-weight:700;line-height:.98;min-height:44px}
.fxcue{font-size:13.5px;color:var(--t2);margin-top:8px;line-height:1.45}
.fxtar{font-family:var(--f-n);font-size:52px;font-weight:800;font-style:italic;color:#fff;margin-top:12px;
direction:ltr;text-align:right;letter-spacing:0;line-height:1}
.stall{margin-top:10px;border-right:3px solid var(--gd);padding:7px 11px 7px 0;
font-size:12.5px;line-height:1.45;color:var(--t2)}
.fxnav{display:flex;gap:8px;margin-top:12px}
.fxnav button{flex:1;background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:13px 6px;
font-size:14.5px;font-weight:600;color:#C8C8CE;min-height:52px}
.fxnav button.go{background:var(--redg);color:#fff;border-color:rgba(255,120,110,.3);box-shadow:0 10px 22px -14px rgba(225,6,0,.95),inset 0 1px 0 rgba(255,255,255,.18)}
.fxnav button.fin{background:var(--gsolid);color:var(--on);border-color:var(--gd);font-weight:700}
/* "הקודם" כבוי: אפור על אפור, אבל קריא (4.6:1). השקיפות הישנה ירדה ל-1.86:1. */
.fxnav button.off{opacity:1;color:#808088;background:transparent;border-color:rgba(255,255,255,.08)}
.seg{display:flex;gap:7px;margin:16px 0 4px}
.sg{flex:1;background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:15px;
padding:11px 6px;text-align:center;min-height:62px;box-shadow:var(--hi)}
.sg b{display:block;font-size:14.5px;font-weight:700;color:var(--t2);line-height:1.2}
.sg i{display:block;font-style:normal;font-size:11.5px;color:var(--t3);margin-top:4px;font-weight:500}
.sg.on{border-color:rgba(255,75,69,.7);background:linear-gradient(180deg,rgba(225,6,0,.2),rgba(225,6,0,.06))}
.sg.on b{color:#fff}
.sg.on i{color:#FF8A85}
.sg.fin{border-color:rgba(201,162,39,.7)}
.sg.fin b,.sg.fin i{color:var(--ok)}
.notes{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
/* ── כרטיסים עם הקשר ── */
.intent,.slp,.ngame,.pse{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:18px;padding:15px;margin-top:12px;box-shadow:var(--hi)}
.intent .ih{font-size:13px;color:#D4D4D8;margin-bottom:8px}
.intent .it{font-size:15px;line-height:1.55;color:#E2E2E6}
.intent.on,.slp.on,.foc{background:linear-gradient(135deg,rgba(232,194,74,.15),rgba(232,194,74,.03) 65%),#141416;border:1px solid rgba(232,194,74,.4)}
.intent.on .ih,.slp.on .slh,.foc .fh{color:var(--ok)}
.intent.on .ih::before,.slp.on .slh::before,.foc .fh::before{background:var(--ok)}
/* בתוך כרטיס זהב האפור המושתק יורד מתחת ל-4.5:1 — עולים לאפור הבהיר */
.slp.on .tiny,.intent.on .tiny,.foc .tiny,.slp.on .slm{color:var(--t2)}
.iact{display:flex;gap:7px;margin-top:12px}
.iact button{flex:1;background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:12px 6px;
font-size:13.5px;font-weight:600;color:#C8C8CE;min-height:46px}
.iact button.go{background:var(--redg);color:#fff;border-color:rgba(255,120,110,.3)}
.dsel{display:flex;gap:5px;margin:14px 0 12px}
.dbt{flex:1;background:var(--ctl);border:1px solid var(--ln);border-radius:11px;padding:12px 0;
font-size:14px;font-weight:600;color:var(--t2);min-height:46px}
.dbt.on{background:var(--redg);color:#fff;border-color:rgba(255,120,110,.3)}
.srow{display:flex;width:100%;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.05);
background:var(--card);border-radius:14px;padding:12px 13px;margin-bottom:7px;min-height:52px;text-align:right}
.srow .sbox{width:26px;height:26px;border-radius:8px;border:2px solid #6A6A72;flex:0 0 26px;
display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--on)}
.srow .snm{flex:1;font-size:15px;font-weight:600}
.srow.on .snm{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chp{background:var(--ctl);border:1px solid var(--ln);border-radius:999px;padding:11px 14px;
font-size:13.5px;font-weight:500;color:#C8C8CE;min-height:46px}
.chp.on{background:var(--gsolid);border-color:var(--gd);color:var(--on);font-weight:700}
.chp.fx.on{background:var(--redg);border-color:rgba(255,120,110,.3);color:#fff}
.mb{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mbb{flex:1 1 30%;background:var(--ctl);border:1px solid var(--ln);border-radius:12px;padding:12px 4px;
font-size:13.5px;font-weight:600;color:#C8C8CE;min-height:48px}
.mbb.on{background:var(--redg);border-color:rgba(255,120,110,.3);color:#fff}
.foc{border-radius:15px;padding:14px;margin-top:12px}
.foc .fh{font-size:13px}
.foc .ft{font-family:var(--f-d);font-size:28px;font-weight:700;line-height:1.05;margin-top:6px}
.foc .fs{font-size:12.5px;color:var(--t2);margin-top:4px}
/* ---------- שינה ---------- */
.slp .slh{font-size:14px;color:#D4D4D8}
.slb{display:flex;gap:7px;margin-top:12px}
.slb button{flex:1 1 0;min-width:0;background:var(--ctl);border:1px solid var(--ln);
border-radius:14px;min-height:60px;font-family:var(--f-n);font-size:28px;font-weight:700;color:#fff}
.slb button:active:not([disabled]){background:var(--red);border-color:var(--red)}
.slb button.on{background:var(--gsolid);border-color:var(--gd);color:var(--on)}
.slr{display:flex;align-items:center;gap:12px;margin-top:10px}
.slv{flex:0 0 auto;font-family:var(--f-n);font-size:56px;font-weight:800;font-style:italic;line-height:.9;color:#fff}
.slp.on .slv{color:var(--ok)}
.slp.spark .slv{animation:stamp .5s var(--ease) both}
.slm{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600;color:var(--t2)}
.sle{flex:0 0 auto;background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:0 14px;
min-height:44px;font-size:12.5px;font-weight:600;color:#C8C8CE}
.slc{margin-top:16px}
/* שורת העמודות היא מיכל בגובה קבוע ומדויק, כדי שקו היעד יישען על מספר
   ידוע ולא על ניחוש של גובה התווית שמתחתיו. */
.slbars{position:relative;display:flex;gap:6px;align-items:flex-end;height:84px}
.slbar{flex:1 1 0;min-width:0;height:100%;border-radius:8px;background:var(--c2);
display:flex;align-items:flex-end;overflow:hidden}
.slbar i{display:block;width:100%;border-radius:8px;transform-origin:bottom}
#app.enter .slbar i{animation:growY .6s var(--ease) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
.slbar i.ok{background:var(--gsolid)}
/* לילה קצר נראה — הוא פשוט לא זוהר. אפור ולא אדום: אין כאן כישלון לסמן. */
.slbar i.low{background:#6E6E73}
.slbar i.none,.slbar i.fut{background:transparent}
.sldls{display:flex;gap:6px;margin-top:6px}
.sldl{flex:1 1 0;min-width:0;text-align:center;font-size:11.5px;font-weight:600;color:var(--t3)}
.sldl.t{color:#fff}
.sltg{position:absolute;right:0;left:0;bottom:calc(84px*.8);height:1px;
background:var(--red);opacity:.6;pointer-events:none}
/* התווית יושבת מתחת לגרף ולא עליו: תג שצף בפינה נדרס על ידי עמודה גבוהה
   ונצמד לשפת הכרטיס. מקרא לא מתנגש עם שום נתון. */
.sltgl{display:flex;align-items:center;gap:6px;margin-top:10px;
font-size:11.5px;font-weight:600;color:var(--t3)}
.sltgl i{flex:0 0 16px;height:1px;background:var(--red);opacity:.6}
/* מידע ולא בקשה: כרטיס ניטרלי. האדום שמור לכפתור */
.ngame{background:var(--card)}
.ngame .ngh{font-size:13px;color:#D4D4D8}
.ngame .ngt{font-family:var(--f-d);font-size:32px;font-weight:700;line-height:1;margin-top:7px}
.ngame .ngd{font-size:12.5px;color:var(--t2);margin-top:4px}
.anch{margin-top:11px;padding-top:11px;border-top:1px solid var(--ln)}
.anch .anh{font-size:12.5px;color:var(--t2)}
.anch .ant{font-family:var(--f-d);font-size:26px;font-weight:700;line-height:1.05;margin-top:5px}
.anch .ans{font-size:12.5px;color:var(--t2);margin-top:3px;line-height:1.45}
.fin{width:100%;background:var(--c2);border:1px solid var(--c3);border-radius:12px;
padding:13px;color:#fff;font-size:15px;min-height:48px}
/* כרטיס שמבקש פעולה: ניטרלי, עם קו אדום דק למעלה. אדום מלא רק על הכפתור שבו */
.gcard{position:relative;overflow:hidden;background:radial-gradient(70% 60% at 100% 0%,rgba(225,6,0,.12),transparent 70%),var(--card);
border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:15px;margin-top:12px;box-shadow:inset 0 2px 0 var(--red)}
.grow{padding:12px 0;border-bottom:1px solid var(--ln)}
.grow:last-child{border-bottom:none}
.danger{border:1px solid #4A1512;border-radius:15px;padding:14px;margin-top:30px}
.dtitle{font-size:12.5px;color:#CC6E68;margin-bottom:10px}.dtitle::before{background:#CC6E68}
.dbtn{width:100%;border:1px solid #5A1C18;border-radius:12px;padding:12px;font-size:13.5px;
font-weight:600;color:#E8908B;margin-bottom:7px;min-height:46px}
.dbtn:last-child{margin-bottom:0}
.dbtn:active:not([disabled]){background:#2A1210}
.note{background:transparent;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 15px;font-size:12.5px;
font-weight:500;color:#B8B8BE;min-height:44px}
.note.warn{border-color:#5A2320;color:#E8908B;background:rgba(225,6,0,.06)}
.ckw{border-bottom:1px solid var(--ln)}
.ckw:last-child{border-bottom:none}
.ckw .chk{border-bottom:none}
.ckact{display:flex;justify-content:flex-start;padding:0 0 12px 38px}
.tmr{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:999px;
padding:10px 14px;font-size:13px;font-weight:600;color:#C8C8CE;min-height:44px}
.tmr .ltr{font-family:var(--f-n);font-size:17px;font-weight:700}
.tmr.run{border-color:var(--red2);color:var(--red2)}
.lgd{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--t3);margin-top:11px}
.lgd span{display:flex;align-items:center;gap:5px}
.lgd i{width:14px;height:8px;border-radius:3px;background:var(--gsolid);display:block}
.lgd i.g{background:var(--miss)}
.lgd i.w{background:#35353B}
.hist{margin-top:16px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
border-bottom:1px solid var(--ln);font-size:13px}
.hrow:last-child{border-bottom:none}
.hrow .wl{color:var(--t2)}
.hrow .fr{display:flex;gap:6px;flex:0 0 auto}
.hrow .fr b{font-weight:600;flex:0 0 46px;min-width:0;text-align:center;
white-space:nowrap;overflow:hidden;text-overflow:clip}
.hrow .fr b.n{direction:ltr;unicode-bidi:bidi-override;font-family:var(--f-n);font-size:16px;font-weight:700}
.hrow .fr .full{color:var(--ok)}
.toast{position:fixed;bottom:calc(var(--nav) + 14px);right:16px;left:16px;max-width:520px;margin:0 auto;
background:rgba(32,32,36,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px;text-align:center;
font-size:14.5px;font-weight:500;z-index:95;opacity:0;transform:translateY(16px) scale(.97);
transition:opacity .2s var(--ease),transform .32s var(--spring);pointer-events:none;box-shadow:0 18px 40px -18px rgba(0,0,0,.9)}
.toast.on{opacity:1;transform:none}
/* ---------- שורת הסטטוס ----------
   האפליקציה מותקנת במסך הבית עם black-translucent: התוכן נגלל מתחת לשעון
   ולסוללה. רצועה קבועה בגובה האזור הבטוח מסתירה את מה שעובר מתחתיה. */
.topcap{position:fixed;top:0;right:0;left:0;height:env(safe-area-inset-top,0px);
background:var(--bg);z-index:65;pointer-events:none}
/* ---------- מותג ---------- */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
/* הלוגו נלקח מאייקון מסך הבית (פעם אחת, למשתנה CSS) — בלי עותק שני של התמונה בקובץ */
.blogo{flex:0 0 38px;width:38px;height:38px;border-radius:11px;display:block;
background:var(--logo,none) center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 16px -6px rgba(225,6,0,.6)}
.btx{display:flex;flex-direction:column;line-height:1;text-align:left;min-width:0}
.btx b{font-family:var(--f-n);font-size:19px;font-weight:800;font-style:italic;letter-spacing:.6px;color:#fff;white-space:nowrap}
.btx i{font-style:normal;font-size:11px;font-weight:500;color:var(--t3);margin-top:3px;white-space:nowrap}
/* ---------- אוכל: רגעים ומנות ----------
   רגע הוא כיוון, לא שעה. כל רגע נסגר בנגיעה אחת — מנה גדולה או קטנה. */
.fpips{display:flex;gap:5px;margin-top:16px;align-items:flex-end}
.fpips span{flex:1 1 0;min-width:0;border-radius:4px;background:var(--c3);height:10px}
.fpips span.bg{height:16px}
.fpips span.bg+span:not(.bg){margin-right:8px}
.fpips span.on{background:var(--gsolid)}
.fpips span.x{flex:0 0 14px;background:var(--gsolid)}
.fpips span.fx-pop{animation:pop .5s var(--spring) both;transform-origin:bottom}
.fmore{color:var(--ok);font-weight:700}
.mo{border-bottom:1px solid var(--ln)}
.mo:last-child{border-bottom:none}
.mor{display:flex;align-items:center;gap:8px;min-height:60px}
.mon{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;
padding:0;text-align:right;font-size:15.5px;font-weight:600;line-height:1.25}
.chev{flex:0 0 auto;width:7px;height:7px;border-left:2px solid var(--t3);border-bottom:2px solid var(--t3);
transform:rotate(-45deg);margin-top:-4px;transition:transform .25s ease}
.mo.open .chev{transform:rotate(135deg);margin-top:3px}
.szs{flex:0 0 auto;display:flex;gap:6px}
.szb{min-width:66px;min-height:46px;background:var(--ctl);border:1px solid var(--ln);border-radius:999px;
padding:0 9px;font-size:13.5px;font-weight:600;color:#C8C8CE}
.szb:active:not([disabled]){background:var(--red);border-color:var(--red);color:#fff}
.mo .szb{background:transparent;border-color:rgba(255,255,255,.16);color:#E4E4E8}
.ideas{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.ideas>div{overflow:hidden;min-height:0}
.mo.open .ideas{grid-template-rows:1fr}
.idt{font-size:12.5px;color:var(--t2);line-height:1.55;padding:0 0 12px}
.mdone{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--ln)}
.mdone:last-child{border-bottom:none}
.mdone .box{background:var(--gsolid);border-color:var(--gd);color:var(--on)}
.mdone.fx .box{animation:pop .44s var(--spring) both}
.mdone .mdn{flex:1 1 auto;min-width:0;font-size:14px;color:var(--t3)}
.mdone .msz{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--ok)}
.undo{flex:0 0 auto;min-height:44px;min-width:44px;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--t2)}
.xtra{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xchip{display:flex;align-items:center;gap:7px;min-height:44px;border:1px solid rgba(232,194,74,.45);border-radius:999px;
background:rgba(232,194,74,.10);padding:0 12px;font-size:13.5px;font-weight:600;color:var(--ok)}
.xchip i{font-style:normal;color:var(--t3);font-weight:500}
/* ---------- נוכחות באימון קבוצה ---------- */
.tmrow{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln)}
.tmrow .tmt{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:600}
.tmb{flex:0 0 auto;min-height:46px;min-width:100px;border:1px solid rgba(255,120,110,.3);border-radius:999px;background:var(--redg);
color:#fff;font-size:14.5px;font-weight:700;padding:0 14px}
.tmb.on{background:var(--gsolid);border-color:var(--gd);color:var(--on)}
/* ---------- שינה: קדימה, ולילות חסרים ---------- */
.slft{font-size:15px;line-height:1.55;color:#DCDCE0;margin-top:8px}
.slft b{color:#fff;font-weight:700;font-family:var(--f-n);font-size:19px}
.slact{display:flex;gap:7px;margin-top:11px}
.sldy{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.sldy:first-of-type{border-top:none;padding-top:0}
.sldy .sln{font-size:14px;font-weight:700}
.sldy .sln.got{color:var(--ok)}
.wk2{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.wk2 .chp{flex:1 1 28%}
/* ---------- הפסקה ---------- */
.pse .psh{font-size:13px;color:var(--t2)}
.pse .pst{font-size:16px;font-weight:700;margin-top:4px}
.big[disabled]{opacity:.35}

/* ── רגע הישג בגיליון ──
   מדליה שנכנסת עם קפיץ, וי שנמתח, הבזק אחד, ספרות שעולות מאפס. ואז שקט. */
.cel{text-align:center;padding:6px 0 2px;position:relative}
.medal{position:relative;width:88px;height:88px;margin:0 auto;border-radius:50%;background:var(--gsolid);color:var(--on);
display:flex;align-items:center;justify-content:center;animation:medal .62s var(--spring) both;
box-shadow:0 0 0 8px rgba(232,194,74,.08),0 16px 40px -12px rgba(232,194,74,.6),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.12)}
.medal svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
.medal .mk{stroke-dasharray:21;stroke-dashoffset:21;animation:draw .36s .4s var(--ease) forwards}
.medal .star{fill:currentColor;stroke:none;animation:pop .5s .35s var(--spring) both}
.medal .gl{position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate}
.medal .gl::after{content:'';position:absolute;left:0;top:-40%;bottom:-40%;width:60%;pointer-events:none;
background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);animation:sweep .9s cubic-bezier(.3,0,.2,1) .55s 1 both}
.medal::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ok);animation:halo .8s .25s var(--ease) both;pointer-events:none}
.medal.lite::after{display:none}
.celk{display:inline-block;margin-top:18px;font-size:12px;font-weight:700;color:var(--ok);
padding:3px 12px;background:rgba(232,194,74,.12);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);animation:rise .4s .3s var(--ease) both}
.celh{font-family:var(--f-d);font-size:44px;font-weight:700;line-height:.95;margin-top:10px;animation:slam .5s .2s var(--ease) both}
.cel .sub{margin-top:6px;animation:rise .4s .38s var(--ease) both}
.celn{font-family:var(--f-n);font-size:104px;font-weight:800;font-style:italic;line-height:.85;
color:var(--ok);text-shadow:0 6px 30px rgba(232,194,74,.28);
animation:slam .55s .1s var(--ease) both;padding:0 .08em}
.celst{animation:rise .45s .45s var(--ease) both}
.sc .stat .v.gold{color:var(--ok)}
/* ── קישור טקסט: תווית אפורה + חץ, בלי קו תחתון ── */
.lnk{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 6px;font-size:13px;font-weight:600;color:var(--t2)}
.lnk::after{content:'';flex:0 0 6px;width:6px;height:6px;border-left:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg);margin-top:1px}
.lnk.sw::after{display:none}
.lnk .ltr{font-family:var(--f-n);font-size:15px;font-weight:700}
/* ── עלייה במשקל: הישג, לא אזהרה ── */
.upbox{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:13px 14px;border-radius:15px;
background:linear-gradient(135deg,rgba(232,194,74,.15),rgba(232,194,74,.03) 65%),#141416;border:1px solid rgba(232,194,74,.4)}
.upbox .upi{flex:0 0 34px;height:34px;border-radius:50%;background:var(--gsolid);color:var(--on);display:flex;align-items:center;justify-content:center}
.upbox .upi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.upbox b{color:var(--ok);font-weight:700}
.upbox p{font-size:13.5px;color:#D8D8DC;line-height:1.55;margin-top:2px}
/* ── מספר השבוע כמספר גופייה בפינה הריקה של הכרטיס ── */
.hero::after{content:attr(data-wk);position:absolute;z-index:-1;left:-2px;top:50px;pointer-events:none;
font-family:var(--f-n);font-weight:800;font-style:italic;font-size:124px;line-height:.8;direction:ltr;
color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.075)}
/* ── שיאים: אריחים, החדש קודם ── */
/* שם המחלקה wkdd ולא wk2: .wk2 כבר תפוס (שבבי הלילות החסרים) */
.hero.wkdd::after{font-size:96px;top:58px}
.prg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prt{min-width:0;background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:12px 13px 12px;box-shadow:var(--hi)}
.prt .pn{font-size:12.5px;font-weight:600;color:var(--t2);line-height:1.3;height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prt .pv{display:flex;align-items:baseline;gap:5px;margin-top:6px}
.prt .pv .ltr{font-family:var(--f-n);font-size:38px;font-weight:700;line-height:1;color:#fff}
.prt .pv i{font-style:normal;font-size:13px;font-weight:600;color:var(--t2)}
.prt .pr2{font-size:12px;color:var(--t2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prt .pr2 .ltr{font-family:var(--f-n);font-size:14px;font-weight:700;color:#fff}
.prt.new{border-color:rgba(232,194,74,.42);background:linear-gradient(160deg,rgba(232,194,74,.15),rgba(232,194,74,.02) 62%),#141416}
.prt.new .pv .ltr{color:var(--ok)}
.prt.new .pr2 b{color:var(--ok);font-weight:700}
/* ── נתוני גוף: לבן, לא זהב ── */
.bwv{font-weight:600;color:var(--t2)}
.bwv .ltr{font-family:var(--f-n);font-size:20px;font-weight:700;color:#fff;margin-left:3px}

/* ── סבב 4: רגעים ── */
/* שיא אישי בסט: האריח הופך לזהב מלא, עם התווית "שיא". ברגע השמירה — חותמת, הבזק אחד וחלקיקים */
.set.pr{background:var(--gsolid);border-color:var(--gd);color:var(--on)}
.set .prb{display:block;font-family:var(--f-b);font-size:10.5px;font-weight:700;line-height:1;margin-top:2px}
.set{display:flex;flex-direction:column;align-items:center;justify-content:center}
.set.fx-pr{animation:prIn .55s var(--spring) both}
@keyframes prIn{0%{transform:scale(1.4) rotate(-4deg);opacity:.3}55%{transform:scale(.94) rotate(1deg);opacity:1}100%{transform:none}}
/* הסט הבא נדלק כשהמנוחה נגמרת */
.set.fx-nudge{animation:nudge .75s var(--ease) 1}
@keyframes nudge{0%{transform:none;box-shadow:0 0 0 0 rgba(255,75,69,.9)}28%{transform:scale(1.08)}70%{box-shadow:0 0 0 14px rgba(255,75,69,0)}100%{transform:none;box-shadow:0 0 0 0 rgba(255,75,69,0)}}
/* הלוח השבועי נבנה עמודה אחרי עמודה כשנכנסים ללשונית */
#app.enter .wk .c{animation:cellIn .42s var(--spring) both}
@keyframes cellIn{from{transform:scale(.35);opacity:0}to{transform:none;opacity:1}}
#app.enter .wk>:nth-child(8n+2){animation-delay:.10s}#app.enter .wk>:nth-child(8n+3){animation-delay:.14s}
#app.enter .wk>:nth-child(8n+4){animation-delay:.18s}#app.enter .wk>:nth-child(8n+5){animation-delay:.22s}
#app.enter .wk>:nth-child(8n+6){animation-delay:.26s}#app.enter .wk>:nth-child(8n+7){animation-delay:.30s}
#app.enter .wk>:nth-child(8n+8){animation-delay:.34s}
/* אריחי השיאים נכנסים אחד אחרי השני */
#app.enter .prt{animation:rise .4s var(--ease) both}
#app.enter .prt:nth-child(2){animation-delay:.05s}#app.enter .prt:nth-child(3){animation-delay:.1s}#app.enter .prt:nth-child(4){animation-delay:.15s}
/* כמה הטבעת עלתה מאז הפעם הקודמת שראית אותה */
.rdl{position:absolute;left:50%;top:-6px;z-index:2;pointer-events:none;font-family:var(--f-n);font-size:20px;font-weight:800;font-style:italic;
color:var(--ok);text-shadow:0 2px 12px rgba(0,0,0,.8);transform:translateX(-50%);animation:delta 1.5s .25s var(--ease) both}

/* יום ריק לפי המערכת (שישי) לא שובר רצף — הוא באמת יום מנוחה.
   יום שרוקן ידנית כן נחשב יום שלא נעשה בו כלום. */
/* יום הפסקה מחזיר null: הוא לא מלא ולא שבור — הרצף פשוט מדלג עליו. */
function dayDoneAll(back){const d=nowD();d.setDate(d.getDate()-back);
const w=d.getDay(),k=dkey(d),S3=sets();
if(pausedOn(k))return null;
const pl=ROWS.filter(([,key])=>isPl(key,k,w));
if(!pl.length)return !SKEYS.filter(x=>x!=='team').some(x=>SCHED[x].includes(w));
return pl.every(([,key])=>S3[key].has(k))}
function fullStreak(){let n=0;for(let i=1;i<=90;i++){const r=dayDoneAll(i);
if(r===null)continue;if(r)n++;else break}return n}
/* רצף ימים מלאים, עם הקפאה אחת לכל שבעה ימים רצופים.
   היום הראשון שנשבר הוא בדרך כלל גם האחרון — ההקפאה קונה לו יום. */
function dayStreak(){let n=0,fr=0,sinceFr=99;
for(let i=(dayDoneAll(0)===true?0:1);i<=120;i++){const r=dayDoneAll(i);
 if(r===null)continue;
 if(r){n++;sinceFr++;continue}
 if(sinceFr>=7){fr++;sinceFr=0;n++;continue}
 break}
return{n,fr}}
function missedYesterday(){if(!workDays())return false;
const d=nowD();d.setDate(d.getDate()-1);
const w=d.getDay(),k=dkey(d),S3=sets();
const pl=ROWS.filter(([,key])=>isPl(key,k,w));
return pl.length>0&&!pl.some(([,key])=>S3[key].has(k))}
/* אימון קבוצה שנרשם ב"הגעתי" נספר בימי האימון, כמו כל בלוק. */
function workDays(){const S3=sets(),u=new Set();
ROWS.forEach(([,k])=>S3[k].forEach(x=>u.add(x)));S3.team.forEach(x=>u.add(x));return u.size}
function bestGain(){let best=null;
Object.keys(EX).forEach(id=>{const all=S.sessions.map(x=>x.log[id]).filter(l=>l&&l.length);
if(all.length<2)return;
const a=Math.max(...all[0].map(x=>x[0])),b=Math.max(...all[all.length-1].map(x=>x[0]));
const g=Math.round((b-a)*2)/2;
if(g>0&&(!best||g>best.g))best={n:EX[id].n,g}});return best}
function bwGain(){if(S.bw.length<2)return null;
const g=Math.round((S.bw[S.bw.length-1].kg-S.bw[0].kg)*10)/10;return g>0?g:null}

function ctxKey(){const d=nowD().getDay();
if(pausedOn(today()))return 'pause';
const pct=dayPct();
if(gameOn(today()))return 'game';
if(d===5&&pct<1)return 'rest';
if(pct>=1)return 'done';
if(pct>0)return 'mid';
if(progWeek()===6)return 'week6';
if(workDays()<3&&progWeek()<=2)return 'first';
if(progWeek()>=10)return 'late';
if(fullStreak()>=3)return 'streak';
if(missedYesterday())return 'comeback';
return 'fresh'}
function hsh(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h)}
function motiv(){const c=ctxKey();
const pool=(LINES[c]||LINES.fresh).map(x=>typeof x==='function'?x():x).filter(Boolean);
if(!pool.length)return '';
return pool[hsh(today()+c)%pool.length]}

let gameCtx=null;
function saveGame(){const k=gameCtx,d=gDraft;
if(d.mb<0){toast('כמה שיחקת?');return}
if(!S.games)S.games=[];
const i=S.games.findIndex(x=>x.d===k);
const b=i>-1?S.games[i]:{opp:'',home:1};
const rec={d:k,opp:b.opp||'',home:b.home?1:0,mb:d.mb,
 good:d.mb===0?'':d.good,fix:d.mb===0?'':d.fix,saw:d.mb===0?d.saw:'',
 note:'',prev:d.prev||'',lg:1};
if(i>-1)S.games[i]=rec;else S.games.push(rec);
S.games.sort((a,b)=>dnum(a.d)-dnum(b.d));
if(rec.prev)bumpFocus(rec.prev);
const nf=rec.fix||rec.saw;
if(nf&&(!S.focus||!S.focus.c))setFocus(nf);
save();closeSheet();draw();
toast(focusOn()?'נרשם · הדגש: '+chipName(S.focus.c):'נרשם');
try{unlockAudio();winTone()}catch(e){}
popMile()}

function snapWeek(days){const S3=sets(),ks=days.map(x=>x.k);
const c=k=>[days.filter(x=>S3[k].has(x.k)).length,days.filter(x=>isPl(k,x.k,x.w)).length];
const bw=(S.bw||[]).filter(x=>ks.includes(x.d)).pop();
return{w:days[0].k,gym:c('gym'),foot:c('foot'),shot:c('shot'),fuel:c('fuel'),team:c('team'),
 bw:bw?bw.kg:null,
 g:(S.games||[]).filter(x=>ks.includes(x.d)&&x.lg).map(x=>({d:x.d,mb:x.mb})),
 est:days.some(x=>!(S.dayplan||{})[x.k])?1:0}}
function rollWeeks(){if(!Array.isArray(S.weeks))S.weeks=[];
const cur=weekDays(0)[0].k;let added=0;
for(let b=1;b<=8;b++){const days=weekDays(b),wk=days[0].k;
 if(wk===cur)continue;
 if(S.weeks.some(x=>x.w===wk))continue;
 if(S.start&&dnum(wk)<dnum(weekDays(0)[0].k)-8*6048e5)continue;
 if(S.start&&dnum(days[6].k)<dnum(S.start))continue;
 S.weeks.push(snapWeek(days));added++}
if(added){S.weeks.sort((a,b)=>dnum(a.w)-dnum(b.w));
 if(S.weeks.length>60)S.weeks=S.weeks.slice(-60);save()}
return added}

/* חציון המשקל באימון, לא המקסימום — סט כבד בודד לא מצייר מגמה. */
function exSeries(id){const out=[];
S.sessions.forEach(x=>{const l=(x.log||{})[id];if(!l||!l.length)return;
 const v=l.filter(Boolean).map(y=>y[0]).filter(y=>y>0);
 if(v.length)out.push({d:x.date,kg:med(v)})});
return out}
/* תקיעה = מספר האימונים האחרונים שבהם החציון לא עלה מעל השיא שלפניהם. */
function exStall(id){const s=exSeries(id);
if(s.length<3)return 0;
let top=s[0].kg,n=0;
for(let i=1;i<s.length;i++){if(s[i].kg>top){top=s[i].kg;n=0}else n++}
return n>=3?n:0}
function exTrend(){return Object.keys(EX).map(id=>{const s=exSeries(id);
 if(s.length<2)return null;
 return{n:EX[id].n,a:s[0].kg,b:s[s.length-1].kg,c:s.length,stall:exStall(id)}})
 .filter(Boolean).sort((a,b)=>b.c-a.c).slice(0,6)}

function weekPR(keys){let best=null;
Object.keys(EX).forEach(id=>{let pre=0,top=null,cnt=0;
 S.sessions.forEach(x=>{const l=x.log[id];if(!l||!l.length)return;
  cnt++;const b=l.reduce((a,c)=>c[0]>a[0]?c:a);
  if(keys.includes(x.date)){if(!top||b[0]>top[0])top=b}
  else if(b[0]>pre)pre=b[0]});
 // שיא = הכי כבד בחלון, שגבוה ממה שהיה לפניו, ורק אם עשה את התרגיל יותר מפעם אחת
 if(top&&cnt>=2&&top[0]>pre&&(!best||top[0]>best.kg))
  best={n:EX[id].n,kg:top[0],rp:top[1]}});
return best}

function last7(){const t=nowD();t.setHours(0,0,0,0);
return Array.from({length:7},(_,i)=>{const d=new Date(t);d.setDate(d.getDate()-6+i);
return{k:dkey(d),w:d.getDay()}})}

L.push('כוח '+g.dn+'/'+g.pl+' · רגליים '+f.dn+'/'+f.pl+' · קליעה '+sh.dn+'/'+sh.pl+' · אוכל '+fu.dn+'/'+fu.pl);
if(tm.pl||tm.dn)L.push('אימון קבוצה · הגעתי '+tm.dn+' מתוך '+tm.pl);
{const pd=ks.filter(pausedOn);
 if(pd.length){const rs=[...new Set((S.pauses||[]).filter(p=>!p.x&&pd.some(k=>dnum(k)>=dnum(p.f)&&dnum(k)<=dnum(p.t))).map(p=>pauseName(p.r)))];
  L.push('הפסקה · '+pd.length+' ימים · '+rs.join(', '))}}
if(S.bw.length){const n=S.bw[S.bw.length-1].kg;
 let t='משקל '+n+' ק״ג';
 if(S.bw.length>1){const d=Math.round((n-S.bw[0].kg)*10)/10;t+=' ('+(d>=0?'+':'')+d+' מאז ההתחלה)'}
 L.push(t)}
{const w=sleepWeek();
 if(w.n)L.push('שינה · ממוצע '+w.avg+' שעות · '+w.ok+' מתוך '+w.n+' לילות בטווח');
 else L.push('שינה · לא נרשמה השבוע');}
const pr=weekPR(ks);
if(pr)L.push('שיא חדש · '+pr.n+' '+pr.kg+'×'+pr.rp);
const it=days.filter(x=>(S.intentDays||[]).includes(x.k)).length;
if(it)L.push('כוונה לאימון קבוצה · '+it+' מתוך '+days.filter(x=>isPl('team',x.k,x.w)).length);
(S.games||[]).filter(x=>ks.includes(x.d)&&x.lg).forEach(x=>{
 const mb=(MINB.find(m=>m[0]===x.mb)||MINB[0])[1];
 L.push('','משחק '+fmt(x.d)+(x.opp?' מול '+x.opp:'')+' · '+mb);
 if(x.mb===0){if(x.saw)L.push('\u2192 '+chipName(x.saw))}
 else{if(x.good)L.push('\u2713 '+chipName(x.good));
      if(x.fix)L.push('\u2192 '+chipName(x.fix))}});
if(focusOn())L.push('','הדגש עד המשחק הבא: '+chipName(S.focus.c));
{const cl=(S.focusLog||[]).slice(-3);
 if(cl.length)L.push('דגשים שנסגרו: '+cl.map(x=>chipName(x.c)).join(' · '));}
{const w4=(S.weeks||[]).filter(x=>!x.est).slice(-4);
 if(w4.length>=2){L.push('','\u2014 ארבעת השבועות האחרונים');
  w4.forEach(x=>{const pct=k=>x[k][1]?Math.round(x[k][0]/x[k][1]*100):0;
   L.push(fmt(x.w)+' · כוח '+x.gym[0]+'/'+x.gym[1]+' · רגליים '+x.foot[0]+'/'+x.foot[1]
    +' · קליעה '+x.shot[0]+'/'+x.shot[1]+' · אוכל '+x.fuel[0]+'/'+x.fuel[1]
    +(x.bw?' · '+x.bw+' ק״ג':''))});}}
/* \u05de\u05d2\u05de\u05d4 \u05dc\u05ea\u05e8\u05d2\u05d9\u05dc \u2014 \u05dc\u05e2\u05d5\u05d3\u05d3 \u05d1\u05dc\u05d1\u05d3, \u05de\u05d0\u05d5\u05ea\u05d4 \u05e1\u05d9\u05d1\u05d4: \u05d2\u05e8\u05e3 \u05e9\u05d8\u05d5\u05d7 \u05e9\u05de\u05d3\u05d1\u05e8 \u05d0\u05dc \u05d9\u05dc\u05d3 \u05d1\u05dc\u05d9 \u05de\u05ea\u05d5\u05d5\u05da
   \u05d4\u05d5\u05d0 \u05d1\u05d3\u05d9\u05d5\u05e7 \u05d4\u05de\u05e1\u05e4\u05e8 \u05e9\u05db\u05d5\u05d0\u05d1. \u05db\u05d0\u05df \u05d4\u05d5\u05d0 \u05de\u05d9\u05d3\u05e2 \u05e9\u05de\u05d0\u05e4\u05e9\u05e8 \u05dc\u05d4\u05ea\u05e2\u05e8\u05d1. */
{const tr=exTrend();
 if(tr.length){L.push('','\u2014 \u05de\u05d2\u05de\u05d4 \u05dc\u05ea\u05e8\u05d2\u05d9\u05dc');
  tr.forEach(x=>L.push(x.n+' \u00b7 '+x.a+' \u2192 '+x.b+' \u05e7\u05f4\u05d2'
   +(x.stall?' \u00b7 \u05ea\u05e7\u05d5\u05e2 '+x.stall+' \u05d0\u05d9\u05de\u05d5\u05e0\u05d9\u05dd':'')));}}
/* \u05de\u05d2\u05de\u05ea \u05d4\u05e9\u05d9\u05e0\u05d4 \u05e0\u05e9\u05dc\u05d7\u05ea \u05dc\u05e2\u05d5\u05d3\u05d3 \u05d1\u05dc\u05d1\u05d3. \u05d1\u05d0\u05e4\u05dc\u05d9\u05e7\u05e6\u05d9\u05d4 \u05d0\u05d5\u05e8\u05d9 \u05e8\u05d5\u05d0\u05d4 \u05e8\u05e7 \u05d0\u05ea \u05d4\u05e9\u05d1\u05d5\u05e2 \u05d4\u05e0\u05d5\u05db\u05d7\u05d9. */
{const rows=[];
 for(let b=3;b>=1;b--){const w=sleepWeek(b);
  if(w.n)rows.push(fmt(w.rows[0].k)+' \u00b7 \u05de\u05de\u05d5\u05e6\u05e2 '+w.avg+' \u00b7 \u05d1\u05d8\u05d5\u05d5\u05d7 '+w.ok+'/'+w.n)}
 if(rows.length)L.push('','\u2014 \u05e9\u05d9\u05e0\u05d4, \u05e9\u05d1\u05d5\u05e2\u05d5\u05ea \u05e7\u05d5\u05d3\u05de\u05d9\u05dd',...rows);}
L.push('',fmt(ks[0])+' \u2013 '+fmt(ks[6]));
return L.join('\n')}

   פותח את האפליקציה, ואסור שמשהו יגרום לו להימנע מלפתוח אותה.

let pDraft={r:'',n:0};

function fromISO(v){const q=String(v).split('-');
return q.length===3&&q[0].length===4?(+q[0])+'-'+(+q[1])+'-'+(+q[2]):''}
function toISO(k){const q=String(k).split('-');
return q.length===3?q[0]+'-'+String(+q[1]).padStart(2,'0')+'-'+String(+q[2]).padStart(2,'0'):''}
function nextGame(){const t=dnum(today());
return (S.games||[]).filter(g=>dnum(g.d)>=t&&!g.lg).sort((a,b)=>dnum(a.d)-dnum(b.d))[0]||null}
function pendingGame(){const t=dnum(today());
return (S.games||[]).filter(g=>dnum(g.d)<t&&!g.lg)          // הבוקר שאחרי, לא ערב המשחק
 .filter(g=>!(S.gskip||{})[g.d])

function ensure(){if(!S.cur)S.cur={date:today(),w:nextW(),log:{}}}
function gymSets(){const ids=curW()==='A'?WA:WB;
const tot=ids.reduce((a,id)=>a+EX[id].s,0);
const dn=(S.cur&&S.cur.date===today())?Object.values(S.cur.log).flat().filter(Boolean).length:0;
return[dn,tot]}
let exIdx=-1,gymList=false;
/* בדיקת התאריך חייבת להיות כאן בדיוק כמו ב-gymSets. בלעדיה אימון פתוח
   מאתמול מציג את הסטים של אתמול כסגורים, והמסך נותן שני מספרים סותרים. */
function exDone(id){const lg=(S.cur&&S.cur.date===today()&&S.cur.log[id])||[];
return lg.filter(Boolean).length}
function nextOpen(ids){for(let i=0;i<ids.length;i++)if(exDone(ids[i])<EX[ids[i]].s)return i;return -1}
function exAt(ids){if(exIdx>=0&&exIdx<ids.length)return exIdx;
const n=nextOpen(ids);return n<0?ids.length-1:n}
function exGo(d){const ids=curW()==='A'?WA:WB;
const was=exAt(ids);exIdx=Math.max(0,Math.min(was+d,ids.length-1));if(exIdx!==was)FX.slide=d;draw();window.scrollTo(0,0)}
function exJump(i){exIdx=i;gymList=false;draw();window.scrollTo(0,0)}
function toggleGymList(){gymList=!gymList;draw();window.scrollTo(0,0)}

function bodyGym(){ensure();const ids=curW()==='A'?WA:WB;
return gymList?listGym(ids):focusGym(ids)}

function focusGym(ids){const i=exAt(ids),id=ids[i],e=EX[id];
const dn=exDone(id),lg=(S.cur.log[id]||[]),lp=lastFor(id),nxk=Array.from({length:e.s},(_,q)=>q).find(q=>!lg[q]);
const tot=ids.reduce((a,x)=>a+EX[x].s,0);
const done=ids.reduce((a,x)=>a+exDone(x),0);
const all=done>=tot;
return `${(i===0&&!done)?`<div class="card" style="margin-top:12px" onclick="openWarm()">
<div class="row"><div class="nm">חימום קבוע</div><div class="cq" style="font-size:15px">6 דק׳</div></div>
<div class="cue">5 תרגילים · לחץ לפרטים</div></div>`:''}
<div class="fxhead"><span>תרגיל <span class="ltr">${i+1}</span> מתוך <span class="ltr">${ids.length}</span>
<button class="lnk sw" onclick="flip()"><span>החלף ל-<span class="ltr">${curW()==='A'?'B':'A'}</span></span></button></span>
<button class="lnk" onclick="toggleGymList()">כל האימון</button></div>
<div class="fxbar"><i style="width:${Math.round(done/tot*100)}%"></i></div>
<div class="fxcard${FX.slide?(FX.slide>0?' fx-l':' fx-r'):''}">
<div class="fxname" onclick="openEx('${id}')">${e.n}</div>
<div class="fxcue">${e.cue}</div>
<div class="fxtar"><span class="ltr">${e.s} × ${e.r}</span></div>
${lp?`<div class="last">אחרונה: <span class="ltr">${lp[0]}</span> ק״ג · <span class="ltr">${lp[1]}</span> חזרות</div>`
   :'<div class="last">פעם ראשונה — תתחיל קל</div>'}
${exStall(id)?`<div class="stall">אותו משקל <span class="ltr">${exStall(id)}</span> אימונים.
תוסיף חזרה אחת לסט לפני שאתה מוסיף משקל.</div>`:''}
<div class="sets">${Array.from({length:e.s},(_,k)=>{const v=lg[k];
const pr=v&&isPR(id,k,v[0],v[1]);
return `<button class="set ${v?'on':''}${!v&&k===nxk?' nx':''}${pr?' pr':''}${v&&FX.set===id+':'+k?(pr&&FX.pr?' fx-pr spark':' fx-stamp'):''}" onclick="tapSet('${id}',${k})">${v?`<span class="ltr">${v[0]}×${v[1]}</span>${pr?'<b class="prb">שיא</b>':''}`:'סט '+(k+1)}</button>`}).join('')}</div>
<div class="acts">
${e.v?`<button class="act" onclick="vid('${e.v}')">${PLAY}טכניקה${e.d?` · ${e.d} שנ׳`:``}</button>`:''}
<button class="act" onclick="startT(${e.rest})">מנוחה ${Math.floor(e.rest/60)}:${String(e.rest%60).padStart(2,'0')}</button>
</div></div>
<div class="fxnav">
<button class="${i===0?'off':''}" onclick="exGo(-1)">הקודם</button>
${i<ids.length-1?`<button class="${dn>=e.s?'go':''}" onclick="exGo(1)">${dn>=e.s?'לתרגיל הבא':'דלג'}</button>`
 :`<button class="${all?'fin':'go'}" onclick="finish()">סיימתי את האימון</button>`}</div>
${all&&i<ids.length-1?`<button class="big" style="margin-top:10px" onclick="finish()">סיימתי את האימון</button>`:''}
<div class="tiny" style="text-align:center;margin-top:11px">בפעם הבאה תקבל אימון ${curW()==='A'?'B':'A'}</div>
<div class="notes"><button class="note" onclick="nShort()">אין לי זמן היום</button>
<button class="note warn" onclick="nPain()">אם כואב — מה יורד ראשון</button></div>`}

function listGym(ids){const w=curW();
return `<div class="fxhead"><span>כל האימון</span>
<button class="lnk" onclick="toggleGymList()">חזרה לתרגיל</button></div>
${ids.map((id,i)=>{const e=EX[id],dn=exDone(id),fin=dn>=e.s;
return `<button class="tdi" onclick="exJump(${i})">
<span class="tdt"><b>${fin?'\u2713 ':''}${e.n}</b><i><span class="ltr">${dn}/${e.s}</span> סטים</i></span>
<span class="tdm"><span class="ltr">${e.s} × ${e.r}</span></span></button>`}).join('')}
<button class="big" style="margin-top:12px" onclick="finish()">סיימתי את האימון</button>`}

function flip(){ensure();const n=Object.values(S.cur.log).flat().filter(Boolean).length;
if(!n){doFlip();return}
openSheet(`<div class="grab"></div><div class="h2">להחליף לאימון ${S.cur.w==='A'?'B':'A'}?</div>
<div class="sub"><span class="ltr">${n}</span> הסטים שרשמת באימון ${S.cur.w} יימחקו.</div>
<div style="height:16px"></div>
<button class="big" onclick="doFlip()">כן, החלף</button>
<button class="ghost" onclick="closeSheet()">לא, תחזור</button>`)}
function doFlip(){ensure();S.cur.w=S.cur.w==='A'?'B':'A';S.cur.log={};exIdx=-1;gymList=false;save();closeSheet();draw()}
function vid(v){window.open('https://www.youtube.com/watch?v='+v,'_blank')}

let sheetCtx=null;
function tapSet(id,k){ensure();sheetCtx={id,k};const e=EX[id];const lg=S.cur.log[id]||[];
const sg=(k===0&&!lg.length)?suggestKg(id):null;
const prev=lg[k]||lg[k-1]||(sg?[sg,e.r]:null)||lastFor(id)||[0,e.r];
openSheet(`<div class="grab"></div>
<div class="h2">${e.n}</div><div class="sub">סט ${k+1} מתוך ${e.s}</div>
${sg?`<div class="upbox"><span class="upi" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></span><div><b>הגיע הזמן להוסיף משקל</b>
<p>בפעם הקודמת השלמת את כל ${e.s} הסטים ב-${e.r} חזרות. הצעתי לך <span class="ltr">${sg}</span> ק״ג. אם זה מרגיש כבד מדי — תרד, זה לא ציון.</p></div></div>`:''}
<div class="num">
<div><label>משקל (ק״ג)</label><input id="ikg" type="number" inputmode="decimal" value="${prev[0]||''}"></div>
<div><label>חזרות</label><input id="irp" type="number" inputmode="numeric" value="${prev[1]||e.r}"></div>
</div>
<button class="big" onclick="saveSet()">שמור והתחל מנוחה</button>
<button class="ghost" onclick="clrSet()">נקה סט</button>`)}
function saveSet(){const{id,k}=sheetCtx;
const kg=parseFloat(document.getElementById('ikg').value);
const rp=parseInt(document.getElementById('irp').value);
if(!numOk(kg,0,300)){toast('משקל לא הגיוני — בין 0 ל-300');return}
if(!numOk(rp,1,200)){toast('חזרות חייבות להיות לפחות 1');return}
ensure();if(!S.cur.log[id])S.cur.log[id]=[];const old=S.cur.log[id][k];S.cur.log[id][k]=[kg,rp];save();closeSheet();FX.set=id+':'+k;
const pr=prNew(id,k,kg,rp,old);if(pr)FX.pr=1;haptic(pr?2:1);draw();startT(EX[id].rest);
if(pr){toast('שיא חדש · '+kg+' ק״ג, '+(rp===1?'חזרה אחת':rp+' חזרות'));try{winTone()}catch(e){}}}
function clrSet(){const{id,k}=sheetCtx;if(S.cur.log[id])delete S.cur.log[id][k];save();closeSheet();draw()}
function finish(){if(!S.cur||!Object.values(S.cur.log).flat().filter(Boolean).length){toast('לא רשמת אף סט');return}
S.cur.log=Object.fromEntries(Object.entries(S.cur.log).map(([k,v])=>[k,v.filter(Boolean)]));
const allSets=Object.values(S.cur.log).flat();
const vol=Math.round(allSets.reduce((a,b)=>a+b[0]*b[1],0));
const w=S.cur.w;S.sessions.push(S.cur);S.cur=null;exIdx=-1;gymList=false;save();
const n=S.sessions.length,st=streak();
openSheet(`<div class="grab"></div>
<div class="cel celx">
<div class="celn ltr" data-n="${n}">${n}</div>
<div class="sub" style="margin-top:4px">האימון ה-${n} שלך</div>
<div class="celh" style="margin-top:14px">אימון ${w} הושלם</div></div>
<div class="stat celst" style="margin:20px 0 4px">
<div><div class="v ltr" data-n="${allSets.length}">${allSets.length}</div><div class="k">סטים</div></div>
<div><div class="v ltr" data-n="${vol}">${vol}</div><div class="k">ק״ג שהרמת</div></div>
<div><div class="v ltr" data-n="${st}">${st}</div><div class="k">רצף</div></div></div>
<div class="tiny" style="text-align:center;margin:14px 0 4px">בפעם הבאה: אימון ${w==='A'?'B':'A'}</div>
<button class="big" style="margin-top:12px" onclick="sheetDone('prog')">לראות את המספרים</button>
<button class="ghost" onclick="sheetDone('home')">סגור</button>`);celFx(3)}


function openWarm(){openSheet(`<div class="grab"></div><div class="h2">חימום קבוע · 6-8 דקות</div>
<div class="sub">זהה בכל אימון · הקפיצות רק בימי A</div><div style="height:14px"></div>
${WARMUP.map(w=>`<div class="chk"><div class="ct"><b>${w[0]}</b><div class="cue">${w[1]}</div></div>
<div class="qw"><div class="cq">${cqF(w[2])}</div>${w[3]?`<button class="vi" onclick="vid('${w[3]}')" aria-label="טכניקה">${VI}</button>`:''}</div></div>`).join('')}
<div class="warnbox" style="margin-top:16px"><b>אל תדלג</b><p>כאן נמצאת כל העבודה שמגנה על הברכיים, הקרסוליים והמפשעות.</p></div>
<div class="warnbox" style="margin-top:10px"><b>הקפיצה האנכית — חמישה כללים שאסור לשבור</b>
<p><b>1. כל חזרה בכוונה מקסימלית.</b> חמש חזרות זו לא סדרת כושר. כל אחת היא ניסיון לגעת בנקודה הכי גבוהה שאתה יכול. אם החמישית נמוכה מהראשונה — עצור.<br><br>
<b>2. ירידה מהירה ורדודה.</b> חצי סקוואט זריז, לא צלילה עמוקה ואיטית. עומק הורג את הקפיץ.<br><br>
<b>3. הזרועות זורקות אותך.</b> סוויינג חזק לאחור ואז קדימה־למעלה מוסיף כעשירית מהגובה. רוב הילדים שוכחים מהידיים.<br><br>
<b>4. נחיתה שקטה.</b> אותו מדד בדיוק כמו בבלימה ובנחיתה על רגל אחת.<br><br>
<b>5. אחרי החימום, לפני הסקוואט — לעולם לא בסוף אימון.</b> ואם הברך כואבת, עוצרים. בגיל הזה לא דוחפים דרך כאב.</p></div>`)}

function openEx(id){const e=EX[id];openSheet(`<div class="grab"></div>
<div class="h2">${e.n}</div><div class="sub">${e.e} · <span class="ltr">${e.s} × ${e.r}</span> · מנוחה ${e.rest} שנ׳</div>
<div style="height:16px"></div>
<div class="blk"><h4>איך עושים</h4><ol>${e.how.map(h=>`<li>${h}</li>`).join('')}</ol></div>
<div class="blk"><h4>מה אתה אמור להרגיש</h4><div class="feel"><p>${e.feel}</p></div></div>
<div class="blk"><h4>הטעות הנפוצה</h4><p>${e.mis}</p></div>
<div class="blk"><h4>אם המכשיר תפוס</h4><p>${e.alt}</p></div>
${e.v?`<button class="big" onclick="vid('${e.v}')">${PLAY}טכניקה · ${e.ch}${e.d?` · ${e.d} שנ׳`:``}</button>`:''}`)}

/* ---------- personal ---------- */
function dayList(key,def){if(S[key].d!==today()){S[key]={d:today(),done:[],w:S[key].w||def};save()}return S[key]}
function shootState(){if(S.shoot.d!==today()){const prev=S.shoot.d,
fin=(S.shotDays||[]).includes(prev);
S.shoot={d:today(),w:prev?(fin?(S.shoot.w==='A'?'B':'A'):S.shoot.w):'A',done:[]};save()}
return S.shoot}
let trainTab=null;
function trainBlocks(){const sh=shootState(),g=gymSets();
return{gym:{n:'כוח '+curW(),min:45,done:g[0],tot:g[1],pl:isPl('gym',today(),nowD().getDay())},
 foot:{n:isRestDay()?'רגליים · קל':'רגליים',min:isRestDay()?4:12,
       done:S.foot.d===today()?S.foot.done.length:0,tot:todayFoot().length,
       pl:isPl('foot',today(),nowD().getDay())},
 shoot:{n:'בלוק '+sh.w,min:32,done:sh.done.length,tot:(sh.w==='A'?SHA:SHB).length,
        pl:isPl('shot',today(),nowD().getDay())}}}
function trainActive(){const b=trainBlocks();
if(trainTab&&b[trainTab])return trainTab;
// ברירת מחדל: מה שמתוכנן להיום וטרם נסגר
const order=['foot','gym','shoot'];   // סדר התוכנית: רגליים פותחות, ואז כוח, ואז קליעה
const open=order.filter(k=>b[k].pl&&b[k].done<b[k].tot);
if(open.length)return open[0];
const any=order.filter(k=>b[k].pl);
return any.length?any[0]:'foot'}
function setTrain(t){if(t!==trainTab)FX.seg=1;trainTab=t;draw();window.scrollTo(0,0)}
function goTrain(t){tab='train';trainTab=t;draw();window.scrollTo(0,0)}
/* היעד נלקח מ-TODO ולא מונח מראש. כל שורה ברשימת היום קראה ל-goTrain
   בלי קשר לסוג, ולכן "אוכל" נחת על לשונית האימון — שנופלת לכוח. */
function goTodo(k){const t=TODO[k];if(!t)return;
if(t.tab==='train'){goTrain(k==='shot'?'shoot':k);return}
go(t.tab)}

function vTrain(){dayList('foot');
const b=trainBlocks(),act=trainActive();
const seg=['gym','foot','shoot'].map(k=>{const x=b[k],fin=x.tot&&x.done>=x.tot;
 return `<button class="sg ${act===k?'on':''} ${fin?'fin':''}" onclick="setTrain('${k}')">
<b>${fin?'✓ ':''}${x.n}</b><i><span class="ltr">${x.done}/${x.tot}</span> · <span class="ltr">${x.min}</span> דק׳</i></button>`}).join('');
const sub=act==='gym'?'אימון כוח'
 :(isRestDay()&&act==='foot'
   ?({fri:'שישי · 4 דקות בלבד',pre:'לפני משחק · 4 דקות בלבד',post:'אחרי משחק · 4 דקות בלבד'})[lightWhy()]
   :'מה שמתוכנן להיום');
return `<div class="wrap">
<div class="h1">אימון</div>
<div class="sub">${sub}</div><div class="bar"></div>
<div class="seg">${seg}</div>
<div${FX.seg?' class="fx-seg"':''}>${act==='gym'?bodyGym():bodyBlock(act,b)}</div>
</div>`}

function bodyBlock(act,b){const cur=b[act];
const list=act==='foot'?todayFoot():(shootState().w==='A'?SHA:SHB);
/* "אין לי זמן היום" הוא המסר שמונע נטישה, והוא היה מחובר לבלוק הקליעה
   בלבד — למרות שהתוכן שלו מדבר על בלוק הרגליים ומסתיים בכפתור אליו.
   מעכשיו הוא זמין מכל שלושת הבלוקים. "למה היום קצר" הוסר: הוא היה
   כפילות מדויקת של התיבה שמוצגת ממילא באותו תנאי, שלוש שורות מעליו. */
const notes=act==='foot'
 ?`<button class="note warn" onclick="nPain()">אם כואב — מה יורד ראשון</button>
<button class="note" onclick="nNoise()">המדד הוא רעש, לא מאמץ</button>
<button class="note" onclick="nShort()">אין לי זמן היום</button>`
 :`<button class="note" onclick="nShort()">אין לי זמן היום</button>
<button class="note" onclick="nFree()">חופשה או חג</button>`;
return `${act==='shoot'?`<div class="row" style="margin:14px 0 2px;align-items:center">
<div class="sub">${b.shoot.n==='בלוק A'?'קליעה וסיום':'תנועה ומסירה'}</div>
<button class="note" style="min-height:34px;padding:7px 11px" onclick="askFlipShoot()">החלף בלוק</button></div>`:''}
${act==='foot'&&isRestDay()?`<div class="warnbox" style="margin:14px 0 2px">
<b>${({fri:'שישי — מנוחה מהעומס, לא מהעבודה',
     pre:'מחר משחק — הרגליים נשארות טריות',
     post:'אתמול היה משחק — היום הרקמות מתאוששות'})[lightWhy()]}</b>
<p>${({fri:'קפיצות, בלימות ונחיתות יורדות היום. שני תרגילים, ארבע דקות, וזהו.',
     pre:'אותה עבודה, בלי קפיצות ונחיתות. הקואורדינציה נשמרת, הקפיץ נשאר למחר.',
     post:'המשחק הוא העומס הכי גבוה בשבוע. היום שני תרגילים בלי עומס, וזהו.'})[lightWhy()]}</p></div>`:''}
<div class="list" style="margin-top:12px">${(()=>{const nxi=list.findIndex((_,i)=>!S[act].done.includes(i));
return list.map((x,i)=>ck(act,i,x,i===nxi)).join('')})()}</div>
<div class="notes">${notes}</div>`}

function nPain(){openSheet(`<div class="grab"></div><div class="h2">אם כואב — מה יורד ראשון</div>
<div class="sub">הכלל הכי חשוב בבלוק הזה</div><div style="height:14px"></div>
<div class="blk"><p>כאב <b>מתחת לפיקת הברך</b> או <b>בעקב</b> הוא הדגל האדום של הגיל שלך. הוא בא מהצטברות, לא מאימון אחד.</p></div>
<div class="warnbox"><b>מה עושים</b><p><b>קפיצות על קו והנחיתה על רגל אחת יורדות ראשונות.</b> שאר הבלוק ממשיך כרגיל. לא מפסיקים הכל, ולא ממשיכים כרגיל.<br><br>אם הכאב נשאר יותר משבוע — מדווחים למבוגר. זה לא "לדחוף דרך זה".</p></div>`)}
function nNoise(){openSheet(`<div class="grab"></div><div class="h2">המדד כאן הוא רעש, לא מאמץ</div>
<div class="sub">בלימה ונחיתה על רגל אחת</div><div style="height:14px"></div>
